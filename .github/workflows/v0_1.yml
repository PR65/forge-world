name: forge-world-v01

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Pack validation
        run: python scripts/forge_cli.py packs
      - name: Full test suite (incl. mathematical oracles)
        run: python -m pytest tests/
      - name: Flagship determinism smoke
        run: |
          python - <<'PY'
          import json, os
          from forge.engine import ForgeEngine, ObjectiveSpecInput
          from forge.pack import load_pack
          pk = load_pack(os.path.join("packs", "humanoid_india.yaml"))
          eng = ForgeEngine(pk)
          obj = ObjectiveSpecInput(variant_id="hv2_industrial", annual_units=200_000,
                                   min_dva=0.4)
          a = eng.run_scenario(obj, include_deep=False)["run"]["input_hash"]
          b = eng.run_scenario(obj, include_deep=False)["run"]["input_hash"]
          assert a == b, "ModelRun hash not deterministic"
          print("deterministic run hash:", a[:16])
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build console
        working-directory: web
        run: |
          npm ci || npm install
          npm run build
