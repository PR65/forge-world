[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-world"
version = "0.1.0"
description = "Evidence-backed industrial buildability compiler and transformation optimizer"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx2",
]

# Explicit single-package declaration. Flat-layout auto-discovery fails here
# because docs/packs/research/scripts/server/tests/web are non-Python or
# path-run directories; only forge/ is an importable distribution package
# (server/app.py and scripts/forge_cli.py are executed by path, never installed).
[tool.setuptools]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
