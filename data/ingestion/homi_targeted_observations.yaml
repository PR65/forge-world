  - {id: obs.tr.bel.edms, claim_id: tr_ev_bel_edms, source_id: tr_src_bel_edms, subject: "cap:industrial-electronics", predicate: reported_manufacturing_scope, epistemic_class: REPORTED, value_text: "BEL reports PCB, electromechanical, coating, burn-in, thermal-cycle, and embedded-engineering scope in Bengaluru.", geographic_scope: IND, technical_scope: "industrial and embedded electronics", caveat: "Facility scope is not scalable qualified throughput."}
