registry_version: "0.1.0"
title: "FORGE WORLD canonical cross-pack registry"
notes: >
  Explicit ontology bindings for the alpha read model. Mappings are ASSUMPTION
  records about reusable concepts; they do not assert qualified production,
  effective capacity, supply, or builder capability. Evidence work remains
  open where the checked-in packs preserve UNKNOWN.

canonical_capabilities:
  - id: "cap:precision-grinding"
    name: "Precision grinding"
    description: "Grinding processes and equipment for tight geometric and surface specifications."
    aliases: ["precision_grinding", "ultra_precision_grinding", "precision gear grinding"]
    status: UNKNOWN
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    mappings:
      - pack_id: humanoid_india
        entity_ids: [precision_gear_grinder, precision_bearing_grinder]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The pack names precision grinding equipment; capability qualification is not asserted."
      - pack_id: cnc_machining_india
        entity_ids: [precision_surface_grinder, ball_screw_grinder, precision_bearing_grinder]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The CNC pack names grinding routes/equipment; no qualified Indian output is inferred."

  - id: "cap:metrology"
    name: "Industrial metrology"
    description: "Measurement, inspection, calibration, and test capability supporting qualified production."
    aliases: ["industrial metrology", "metrology_test", "measurement and inspection"]
    status: UNKNOWN
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    mappings:
      - pack_id: humanoid_india
        entity_ids: [metrology_cmm]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "CMM equipment reference is not evidence of a qualified metrology service."
      - pack_id: smallsat_india
        entity_ids: [metrology_cmm]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The satellite pack references CMM inspection; facility status remains UNKNOWN."
      - pack_id: cnc_machining_india
        entity_ids: [metrology_cmm, metrology_acceptance_kit, ball_screw_metrology_station]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The CNC pack references acceptance metrology; traceability and throughput remain UNKNOWN."
      - pack_id: nuclear_buildout_india
        entity_ids: [large_metrology_lab, nuclear_calibration_lab, cc_india_nuclear_metrology_unknown]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The nuclear pack references metrology/labs and an explicit evidence gap; qualified throughput remains UNKNOWN."

  - id: "cap:power-electronics"
    name: "Power electronics"
    description: "Power conversion, motor drives, inverter stages, and related control hardware."
    aliases: ["power electronics", "motor drives", "inverter stage"]
    status: UNKNOWN
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    mappings:
      - pack_id: humanoid_india
        entity_ids: [motor_driver_inverter, sic_power_stage]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "Parts are mapped to a reusable domain concept; qualified production is not inferred."
      - pack_id: cnc_machining_india
        entity_ids: [servo_drive, control_power_module, rec_servo_drive]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The CNC pack names servo-drive/power routes; qualification and effective supply remain UNKNOWN."

  - id: "cap:battery-cell"
    name: "Battery-cell manufacturing"
    description: "Cell chemistry, electrode, assembly, formation, aging, and screened-cell routes."
    aliases: ["battery cell", "battery_cell", "cell manufacturing"]
    status: UNKNOWN
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    mappings:
      - pack_id: battery_gwh_india
        entity_ids: [battery_cell_ncm, battery_cell_lfp, rec_cell_ncm, rec_cell_lfp]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "Battery chemistry routes are present; awarded/project capacity is not treated as operating supply."
      - pack_id: humanoid_india
        entity_ids: [battery_cell_liion, rec_battery_cell]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "Robot cell references reuse the canonical cell concept; grade and volume remain unresolved."
      - pack_id: smallsat_india
        entity_ids: [battery_cell_liion_space, rec_battery_pack_satellite]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "Screened space-cell route is a related cell capability, not proof of common qualification."

  - id: "cap:rare-earth-magnet"
    name: "Rare-earth permanent magnet chain"
    description: "Rare-earth oxide, metal/alloy, sintered magnet, and associated qualification chain."
    aliases: ["rare earth magnet", "rare-earth magnet", "NdFeB magnet", "ndfeb_magnet"]
    status: UNKNOWN
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    mappings:
      - pack_id: humanoid_india
        entity_ids: [ndfeb_magnet, reo_ndpr_oxide, rec_ndfeb_magnet]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The pack models a rare-earth route and a proposed programme; realized qualified output is UNKNOWN."
      - pack_id: cnc_machining_india
        entity_ids: [permanent_magnet]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The CNC pack includes a permanent-magnet material input; grade-compatible supply is UNKNOWN."

  - id: "cap:hirel-qualification"
    name: "High-reliability (HiRel) qualification"
    description: "Screening, environmental, radiation, lot acceptance, and customer/regulatory qualification."
    aliases: ["HiRel", "HiRel qualification", "space-grade qualification", "high reliability test"]
    status: UNKNOWN
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    mappings:
      - pack_id: smallsat_india
        entity_ids: [qual_space_battery]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "A qualification gate is mapped to the reusable concept; completion and facility capability remain UNKNOWN."

  - id: "cap:heavy-forging"
    name: "Heavy forging"
    description: "Large-scale forging, heat treatment, inspection, and qualified heavy-component production."
    aliases: ["heavy forging", "large forging", "forging press capability"]
    status: UNKNOWN
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    mappings:
      - pack_id: nuclear_buildout_india
        entity_ids: [heavy_forging_press, forging_manipulator, large_forged_shell, rec_large_forged_shell, qual_large_forging, cc_india_heavy_forging_unknown]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The nuclear pack models heavy-forging dependencies and an UNKNOWN capability claim; no qualified capacity is inferred."

  - id: "cap:cnc-controls"
    name: "CNC controls"
    description: "CNC numerical control, servo drives, feedback, PLC/I/O, and machine-control integration."
    aliases: ["CNC controls", "cnc_controls", "numerical controls", "machine tool controls"]
    status: UNKNOWN
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    mappings:
      - pack_id: cnc_machining_india
        entity_ids: [cnc_controller, rec_cnc_controller, qual_control_system]
        relation: requires_or_represents
        mapping_source: ASSUMPTION
        rationale: "The CNC pack explicitly models controller integration and qualification gates; no supplier capability is asserted."

