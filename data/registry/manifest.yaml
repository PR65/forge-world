evidence_tasks:
  - id: "task:precision-grinding-qualified-output"
    title: "Verify qualified precision-grinding output"
    question: "Which facilities can deliver the required grinding specification, yield, metrology, and qualified annual output?"
    target_canonical_id: "cap:precision-grinding"
    status: OPEN
    priority: high
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    suggested_source_types: [facility_audit, certification, supplier_disclosure, customer_qualification]
  - id: "task:metrology-traceability"
    title: "Verify metrology traceability and throughput"
    question: "Which metrology facilities can measure the relevant tolerances at the required throughput and traceability?"
    target_canonical_id: "cap:metrology"
    status: OPEN
    priority: high
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    suggested_source_types: [calibration_record, facility_audit, certification, supplier_disclosure]
  - id: "task:power-electronics-qualification"
    title: "Verify qualified power-electronics production"
    question: "Which suppliers can produce the required inverter/drive specification with qualification and scalable yield?"
    target_canonical_id: "cap:power-electronics"
    status: OPEN
    priority: high
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    suggested_source_types: [datasheet, certification, supplier_disclosure, customer_qualification]
  - id: "task:battery-cell-grade-fit"
    title: "Resolve battery-cell grade and qualification fit"
    question: "Which cell chemistry, form factor, and qualification route satisfies the pack-specific energy and life envelope?"
    target_canonical_id: "cap:battery-cell"
    status: OPEN
    priority: high
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    suggested_source_types: [cell_datasheet, test_report, plant_disclosure, customer_qualification]
  - id: "task:rare-earth-magnet-qualified-supply"
    title: "Verify rare-earth magnet chain output"
    question: "What qualified, grade-compatible rare-earth magnet output exists by geography and date, including oxide-to-magnet yields?"
    target_canonical_id: "cap:rare-earth-magnet"
    status: OPEN
    priority: high
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    suggested_source_types: [government_release, plant_disclosure, certification, customs_record]
  - id: "task:hirel-space-qualification"
    title: "Verify HiRel qualification route"
    question: "Which laboratories and suppliers can complete HiRel screening, environmental, radiation, and lot-acceptance qualification?"
    target_canonical_id: "cap:hirel-qualification"
    status: OPEN
    priority: high
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    suggested_source_types: [qualification_standard, laboratory_record, certification, customer_qualification]
  - id: "task:heavy-forging-qualified-capacity"
    title: "Identify qualified heavy-forging capacity"
    question: "Which facilities have demonstrated heavy-forging envelope, heat treatment, inspection, and available qualified throughput?"
    target_canonical_id: "cap:heavy-forging"
    status: OPEN
    priority: medium
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    suggested_source_types: [facility_audit, certification, tender, supplier_disclosure]
  - id: "task:cnc-controls-qualification"
    title: "Identify qualified CNC-controls capability"
    question: "Which organizations can supply CNC controls, servo integration, feedback, and support for the target machine specification?"
    target_canonical_id: "cap:cnc-controls"
    status: OPEN
    priority: medium
    epistemic_class: UNKNOWN
    mapping_source: ASSUMPTION
    suggested_source_types: [product_datasheet, certification, supplier_disclosure, customer_reference]
