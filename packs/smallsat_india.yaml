recipes:
  - id: rec_solar_panel_array
    name: Solar array assembly
    output_part: solar_panel_array
    output_quantity: [1, "pcs"]
    maturity: pilot
    applicable_geographies: [INDIA, GLOBAL]
    steps:
      - id: cell_bonding
        name: cell bonding + interconnect
        equipment_classes: [cleanroom_bench]
        yield_fraction: 0.96
      - id: deploy_mech
        name: deployment mechanism integration + test
        equipment_classes: [thermal_vac_chamber]
        yield_fraction: 0.97
    inputs:
      - id: triple_junction_cell
        quantity: [220, "pcs"]

  - id: rec_battery_pack_satellite
    name: Satellite battery pack
    output_part: battery_pack_satellite
    output_quantity: [1, "pcs"]
    maturity: pilot
    requires_qualification: [qual_space_battery]
    steps:
      - id: pack_build_screen
        name: build + screened-lot integration
        equipment_classes: [cleanroom_bench]
        yield_fraction: 0.95
    inputs:
      - id: battery_cell_liion_space
        quantity: [56, "pcs"]

  - id: rec_sat_bus_structure
    name: Bus structure fabrication
    output_part: sat_bus_structure
    output_quantity: [1, "pcs"]
    maturity: series
    applicable_geographies: [INDIA, GLOBAL]
    steps:
      - id: composite_bond
        name: honeycomb/composite layup + bond
        equipment_classes: [autoclave]
        yield_fraction: 0.95
      - id: dim_inspect
        name: dimensional inspection
        equipment_classes: [metrology_cmm]
        yield_fraction: 0.98
    inputs:
      - id: alu_ingot_aero
        quantity: [70, "kg_product"]

