pack_id: smallsat_india
title: "Domain pack 3: India 50 small satellites/yr (300 kg class) by 2030"
version: 1.0.0
geography_focus: INDIA
notes: >
  Low-volume/high-complexity contrast pack. Tests ontology generality: unit economics
  are dominated by HiRel qualification, precision mechanisms (reaction wheels), radiation
  tolerance and test infrastructure rather than raw throughput. Shares enabling
  capabilities with the humanoid and battery packs (Li-ion cells, precision machining,
  edge compute class devices, solar cells).

sources:
  - id: src_isro_ecosystem
    name: Indian space reforms / IN-SPACe ecosystem reporting (supplied corpus context)
    publisher: Government of India / corpus
    url: ""
    source_type: government_programme
    license: public
    access_date: "2026-08-22"
  - id: src_iea_minerals
    name: IEA critical minerals analysis
    publisher: International Energy Agency
    url: "https://www.iea.org/reports/global-critical-minerals-outlook-2026/executive-summary"
    source_type: intergovernmental_analysis
    license: CC BY 4.0 (per IEA)
    access_date: "2026-08-22"
  - id: src_corpus_streams
    name: FORGE WORLD Wide Research corpus stream notes
    publisher: Supplied research corpus
    url: ""
    source_type: research_corpus
    license: supplied-for-project use only
    access_date: "2026-08-22"

evidence:
  - claim_id: ev_space_reforms
    subject: india_space_sector
    predicate: reform_state
    epistemic_class: REPORTED
    value_text: "Indian space sector opened to private participation (IN-SPACe framework); dozens of space startups active; ISRO transfer-of-tech pathways publicised"
    source_ids: [src_isro_ecosystem]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.75, directness: 0.65, recency: 0.85}
    quote_or_caveat: Reform existence is well reported; private HiRel component capacity remains largely UNKNOWN
  - claim_id: ev_hirel_qualification
    subject: space_grade_qualification
    predicate: latency_and_cost_regime
    epistemic_class: REPORTED
    value_text: "Space-grade parts qualification regimes (screening, lot acceptance, radiation testing) drive long lead times and low volumes vs terrestrial electronics"
    source_ids: [src_corpus_streams]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.7, corroboration: 0.7, completeness: 0.45}
  - claim_id: ev_adcs_concentration
    subject: reaction_wheel_supply
    predicate: supplier_concentration
    epistemic_class: REPORTED
    value_text: "Precision ADCS mechanisms (reaction wheels/star trackers) are supplied by a small number of specialized firms concentrated in a few countries"
    source_ids: [src_corpus_streams]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.6, corroboration: 0.6, completeness: 0.4}
  - claim_id: ev_space_pv_cells
    subject: triple_junction_cell_supply
    predicate: production_concentration
    epistemic_class: REPORTED
    value_text: "Space-grade triple-junction GaAs cell production is concentrated in a handful of EU/US suppliers"
    source_ids: [src_corpus_streams]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.6, corroboration: 0.55, completeness: 0.4}

