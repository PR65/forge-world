pack_id: cnc_machining_india
title: "Alpha benchmark: India 100 high-quality CNC machining centers/year"
version: 1.1.0
geography_focus: INDIA
notes: >
  Annual-flow execution benchmark for 100 production-intent vertical machining
  centers per year. The reference architecture is a transparent engineering
  assumption, not a claim that any named Indian supplier can deliver this rate.
  No qualified capacity segments are asserted for the finished machine or its
  decision-sensitive subcomponents; absent supplier/facility evidence remains
  UNKNOWN. The graph recurses into castings, grinding, bearings, motion systems,
  controls, tooling, calibration, and the equipment classes needed by those
  processes. Market presence, government programme participation, and trade
  headings are not treated as supply.

