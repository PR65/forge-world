recipes:
  - id: rec_machine_bed_casting
    name: Machine bed casting, stress relief, machining, and grinding
    output_part: machine_bed_casting
    output_quantity: [1, pcs]
    maturity: pilot
    applicable_geographies: [INDIA, GLOBAL]
    requires_qualification: [qual_structural_casting]
    evidence_ids: [ev_cnc_process_yields]
    steps:
      - id: bed_cast
        name: Cast and inspect bed blank
        equipment_classes: [large_casting_cell]
        yield_fraction: 0.94
      - id: bed_stress_relief
        name: Stress relief and stabilization
        equipment_classes: [stress_relief_furnace]
        cycle_time_per_unit: [12, h]
        yield_fraction: 0.98
      - id: bed_rough_machine
        name: Rough and semi-finish machining
        equipment_classes: [large_bed_cnc]
        cycle_time_per_unit: [8, h]
        yield_fraction: 0.96
      - id: bed_precision_grind
        name: Precision guideway grinding and scraping
        equipment_classes: [precision_surface_grinder]
        cycle_time_per_unit: [6, h]
        yield_fraction: 0.93
      - id: bed_alignment
        name: Datum alignment, scraping, and thermal soak verification
        equipment_classes: [bed_alignment_fixture, metrology_cmm, laser_interferometer_station]
        cycle_time_per_unit: [3, h]
        yield_fraction: 0.98
      - id: bed_metrology
        name: Datum and straightness acceptance
        equipment_classes: [metrology_cmm, laser_interferometer_station]
        yield_fraction: 0.98
    inputs:
      - id: cast_iron_machine_bed_blank
        quantity: [1.25, t_product]
      - id: cbn_grinding_wheel
        quantity: [0.02, kg_product]
      - id: granite_reference_artifact
        quantity: [0.01, pcs]

