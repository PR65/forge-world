evidence:
  - claim_id: ev_mhi_machine_tool_programme
    subject: india_machine_tools
    predicate: programme_context
    epistemic_class: REPORTED
    value_text: "The Ministry of Heavy Industries Capital Goods Scheme includes machine-tool development and a Machine Tool Park/Tumakuru context; the programme does not establish qualified output of 100 high-quality VMCs per year."
    source_ids: [src_mhi_capital_goods]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.9, directness: 0.9, recency: 0.7}
    quote_or_caveat: Programme participation and infrastructure are not evidence of a product-specific, qualified, effective capacity.
  - claim_id: ev_mhi_coe_partners
    subject: india_cnc_ecosystem
    predicate: listed_partners
    epistemic_class: REPORTED
    value_text: "Government project pages list Indian machine-tool and CNC ecosystem partners including Jyoti CNC, Micromatic, and Ace Designers; the listing does not prove a 100/year high-quality machining-center line or customer qualification."
    source_ids: [src_mhi_projects]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.9, directness: 0.8, recency: 0.7}
    quote_or_caveat: Builder/project listing only; no capacity is promoted into the solver.
  - claim_id: ev_cnc_critical_components
    subject: cnc_machining_center
    predicate: strategic_component_dependencies
    epistemic_class: REPORTED
    value_text: "The Department of Heavy Industry strategic plan identifies linear guideways, ball screws, precision bearings, CNC controls, servomotors, and controllers as critical machine-tool components requiring domestic capability attention."
    source_ids: [src_mhi_strategic_plan]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.9, directness: 0.8, recency: 0.7}
    quote_or_caveat: Strategic priority is not proof of present qualified supply, grade, yield, or effective capacity.
  - claim_id: ev_cnc_mrl_framework
    subject: cnc_manufacturing_readiness
    predicate: readiness_framework
    epistemic_class: REPORTED
    value_text: "Manufacturing Readiness Levels provide a ten-level framework covering process, tooling, test equipment, workforce, and production maturity."
    source_ids: [src_dod_mrl]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.9, directness: 0.9, technical_specificity: 0.9}
    quote_or_caveat: MRL is a framework and does not provide Indian CNC capacity.
  - claim_id: ev_cnc_qualification_window
    subject: precision_manufacturing_supplier
    predicate: qualification_latency
    epistemic_class: REPORTED
    value_text: "Supplier/process qualification in advanced manufacturing is commonly reported in planning ranges such as 6–24 months; the actual CNC customer-acceptance gate is customer and process specific."
    source_ids: [src_research_07, src_pri_nadcap]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.7, directness: 0.6, corroboration: 0.7}
    quote_or_caveat: Planning range only; this pack does not convert it into an automatic operating-capacity factor.
  - claim_id: ev_cnc_reference_architecture
    subject: cnc_vmc_reference_architecture
    predicate: engineering_envelope
    epistemic_class: ASSUMPTION
    value_text: "Pack assumption: a high-quality three-axis vertical machining center with production-intent spindle, direct linear motion, closed-loop servo control, automatic tool change, probing, and laser/CMM acceptance."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {technical_specificity: 0.55}
    quote_or_caveat: Architecture is a scenario choice for an auditable alpha benchmark, not a measured industry standard.
  - claim_id: ev_cnc_bom_quantities
    subject: cnc_vmc_reference_architecture
    predicate: bom_coefficients
    epistemic_class: ASSUMPTION
    value_text: "All top-level BOM and recursive recipe-input quantities are explicit engineering assumptions for the alpha architecture; examples include three axis motion sets, one spindle cartridge, and the route-level material, tooling, and metrology coefficients."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {technical_specificity: 0.55}
    quote_or_caveat: Coefficients are linear planning inputs and require design review before procurement.
  - claim_id: ev_cnc_process_yields
    subject: cnc_process_routes
    predicate: process_and_input_coefficients
    epistemic_class: ASSUMPTION
    value_text: "Per-step yields and recursive route-input quantities in the recipes are transparent alpha assumptions to expose gross-up and upstream requirements; they are not observed Indian line data."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {technical_specificity: 0.4}
    quote_or_caveat: Replace yields and every recursive coefficient with measured route data during supplier/process qualification.
  - claim_id: ev_cnc_capacity_unknown
    subject: india_cnc_machining_center_capacity
    predicate: qualified_effective_capacity
    epistemic_class: UNKNOWN
    value_text: "Public evidence reviewed for this pack does not establish a qualified, effective Indian capacity for this exact high-quality VMC architecture or its bottleneck subcomponents at the required rate."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {completeness: 0.2}
    quote_or_caveat: Factory existence, programme participation, trade, or generic machine-tool capability must not be promoted to this capacity claim.
  - claim_id: ev_cnc_recursive_capacity_unknown
    subject: india_precision_motion_and_metrology
    predicate: qualified_recursive_capacity
    epistemic_class: UNKNOWN
    value_text: "Exact Indian capacity, yield, and customer qualification for ground ball screws, robot/machine-grade bearings, precision grinding, high-resolution encoders, and acceptance metrology are not publicly resolved in this pack."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {completeness: 0.2}
    quote_or_caveat: Strategic component lists identify where to investigate, not how much qualified supply exists.

