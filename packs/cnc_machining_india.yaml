product_variants:
  - id: cnc_vmc_100_per_year
    name: "100 high-quality CNC vertical machining centers/year"
    anchor_evidence: [ev_cnc_reference_architecture, ev_cnc_bom_quantities]
    notes: >
      Objective is annual saleable machine output, not installed nameplate or
      historical market demand. A 100-unit objective is multiplied through the
      per-machine BOM and recipe yields. Product/customer acceptance, supplier
      allocation, and effective capacity remain separate unknowns.
    functional_requirements:
      - metric: annual_units
        min: 100
        max: 100
        unit: units/yr
      - metric: positioning_accuracy
        min: 0.005
        max: 0.02
        unit: mm
      - metric: spindle_speed
        min: 12000
        max: 24000
        unit: rpm
      - metric: axis_count
        min: 3
        max: 3
        unit: count
      - metric: saleable_status
        min: 1
        max: 1
        unit: qualified_units
    bom:
      - part: machine_bed_casting
        qty: 1
      - part: machine_column_casting
        qty: 1
      - part: saddle_table_set
        qty: 1
      - part: spindle_cartridge
        qty: 1
      - part: ball_screw_set
        qty: 3
      - part: linear_guide_set
        qty: 3
      - part: servo_motor_axis
        qty: 3
      - part: servo_drive
        qty: 3
      - part: absolute_encoder_axis
        qty: 3
      - part: cnc_controller
        qty: 1
      - part: atc_magazine
        qty: 1
      - part: coolant_lubrication_unit
        qty: 1
      - part: electrical_cabinet
        qty: 1
      - part: safety_enclosure
        qty: 1
      - part: touch_probe
        qty: 1
      - part: metrology_acceptance_kit
