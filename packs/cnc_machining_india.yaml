    output_part: ball_screw_shaft_blank
    output_quantity: [1, pcs]
    maturity: pilot
    applicable_geographies: [INDIA, GLOBAL]
    requires_qualification: [qual_ball_screw]
    evidence_ids: [ev_cnc_process_yields, ev_cnc_recursive_capacity_unknown, ev_thk_ball_screw_grade]
    notes: >
      The selected C3/C5 grade is a specification gate. The route exposes the
      thread grinder, fixture, temperature control, and metrology chain but does
      not assert that any Indian facility has qualified effective capacity.
    steps:
      - id: shaft_turn
        name: Turn shaft blank, centers, and datum ends
        equipment_classes: [large_bed_cnc, shaft_turning_cell]
        yield_fraction: 0.96
      - id: shaft_harden
        name: Induction harden or carburize effective thread zone
        equipment_classes: [vacuum_heat_treatment_furnace, induction_hardening_cell]
        yield_fraction: 0.94
      - id: shaft_thread_grind
        name: Thread grind to selected C3/C5 grade
        equipment_classes: [ball_screw_grinder, ball_screw_grinding_fixture]
        cycle_time_per_unit: [1.5, h]
        yield_fraction: 0.9
      - id: shaft_lead_map
        name: Traceable lead-error, pitch, runout, and thermal map
        equipment_classes: [ball_screw_metrology_station, ball_screw_lead_error_artifact]
        yield_fraction: 0.97
    inputs:
      - id: bearing_steel
        quantity: [0.9, kg_product]
      - id: cbn_grinding_wheel
        quantity: [0.012, kg_product]
      - id: ball_screw_grinding_fixture
        quantity: [0.1, pcs]
      - id: ball_screw_grade_spec
        quantity: [1, pcs]

  - id: rec_ball_screw_grinder_machine
    name: Ball-screw/thread grinder machine-build route
    output_part: ball_screw_grinder
    output_quantity: [1, pcs]
    route_type: secondary
    maturity: prototype
    applicable_geographies: [INDIA, GLOBAL]
    requires_qualification: [qual_ball_screw_grinder_machine]
    evidence_ids: [ev_cnc_process_yields, ev_cnc_grinder_research_question, ev_micromatic_grinding_supplier]
    notes: >
      Machine-builds-machine recursion: this route is a bounded scenario
      representation of a grinder assembled from a precision spindle, linear
      stage, controller, fixture, and metrology package. It is not a claim that
      the named supplier owns this exact machine or that the route is currently
      buildable in India.
    steps:
      - id: grinder_structure
        name: Machine base, thermal stabilization, and guideway preparation
        equipment_classes: [large_bed_cnc, precision_surface_grinder, metrology_cmm]
        yield_fraction: 0.9
      - id: grinder_spindle_integration
        name: Grinding spindle, wheel dressing, and balance integration
        equipment_classes: [precision_assembly_cell, spindle_balance_tester]
        yield_fraction: 0.92
      - id: grinder_control_integration
        name: Axis servo, CNC, dressing, and safety integration
        equipment_classes: [controller_hardware_in_loop_bench, ems_line]
        yield_fraction: 0.94
