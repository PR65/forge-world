execution_model:
  work_packages:
    - id: wp_architecture_and_tolerance_budget
      name: "Freeze VMC architecture, axis error budget, and grade decisions"
      phase: design
      entity_ids: [cnc_vmc_high_quality, machine_bed_casting, ball_screw_set, spindle_cartridge]
      depends_on: []
      acceptance_criteria:
        - "Positioning and repeatability requirements decomposed into structure, guideway, screw, spindle, encoder, thermal, and controller budgets"
        - "Ball-screw C3/C5 choice recorded with explicit tradeoff and supplier RFQ envelope"
      epistemic_class: ASSUMPTION
      evidence_ids: [ev_cnc_reference_architecture, ev_thk_ball_screw_grade, ev_cnc_ballscrew_research_question]
      human_approval_required: true
    - id: wp_bed_structure_route
      name: "Qualify cast bed/column, stress relief, datum machining, and alignment"
      phase: process_qualification
      entity_ids: [machine_bed_casting, machine_column_casting, saddle_table_set, bed_alignment_fixture]
      depends_on: [wp_architecture_and_tolerance_budget]
      acceptance_criteria:
        - "Casting chemistry, shrinkage/defect inspection, stress-relief records, datum geometry, and thermal stabilization are traceable by serial/heat"
        - "Supplier process audit and first-article geometric acceptance complete"
      epistemic_class: ASSUMPTION
      evidence_ids: [ev_cnc_process_yields, ev_cnc_qualification_schedule_assumption]
      human_approval_required: true
    - id: wp_ball_screw_recursive_chain
      name: "Close ball-screw grade -> grinding -> grinder -> metrology chain"
      phase: supplier_and_capital_equipment
      entity_ids: [ball_screw_set, ball_screw_shaft_blank, ball_screw_grinder, ball_screw_metrology_station, ball_screw_grade_spec]
      depends_on: [wp_architecture_and_tolerance_budget]
      acceptance_criteria:
        - "Supplier quote includes C3/C5 grade, lead-error map, preload, runout, life, traceability, and allocation"
        - "Grinder and metrology machine-hour map is measured or explicitly left UNKNOWN"
        - "No supplier is marked qualified on product-page evidence alone"
      epistemic_class: UNKNOWN
      evidence_ids: [ev_thk_ball_screw_grade, ev_cnc_grinder_research_question, ev_cnc_metrology_research_question]
      human_approval_required: true
    - id: wp_spindle_bearing_and_thermal_route
      name: "Qualify spindle rings, bearing set, preload, balance, and thermal growth"
      phase: process_qualification
      entity_ids: [spindle_cartridge, spindle_bearing, bearing_ring_set, bearing_ball_cage_set, spindle_test_bar, thermal_sensor_set]
      depends_on: [wp_architecture_and_tolerance_budget]
      acceptance_criteria:
        - "Bearing grade, matched preload, runout, vibration, lubrication, life, and traceability records accepted"
        - "Spindle thermal map and speed/endurance test meet the signed design envelope"
      epistemic_class: UNKNOWN
      evidence_ids: [ev_nsk_spindle_bearing_scope, ev_cnc_recursive_capacity_unknown, ev_cnc_qualification_schedule_assumption]
      human_approval_required: true
    - id: wp_controls_servo_and_atc_integration
      name: "Integrate controller, servo/encoder loop, ATC, pneumatics, and safety"
      phase: integration
      entity_ids: [cnc_controller, servo_motor_axis, servo_drive, absolute_encoder_axis, atc_magazine, pneumatic_clamp_unit, electrical_cabinet]
      depends_on: [wp_architecture_and_tolerance_budget]
      acceptance_criteria:
        - "Controller/drive/encoder firmware and parameter revisions are configuration-controlled"
        - "ATC cycle, clamp pressure, interlocks, EMC, safe stop, and fault recovery tests pass"
      epistemic_class: UNKNOWN
      evidence_ids: [ev_siemens_controller_scope, ev_cnc_critical_components, ev_cnc_process_yields]
      human_approval_required: true
    - id: wp_final_metrology_and_customer_acceptance
      name: "Execute alignment, thermal, volumetric, spindle, and cutting acceptance"
      phase: customer_qualification
      entity_ids: [machine_alignment_calibration, metrology_acceptance_kit, laser_interferometer_service, precision_cmm_service, touch_probe]
      depends_on: [wp_bed_structure_route, wp_ball_screw_recursive_chain, wp_spindle_bearing_and_thermal_route, wp_controls_servo_and_atc_integration]
      acceptance_criteria:
        - "Traceable laser/CMM/ballbar/spindle records identify instrument, uncertainty, calibration date, machine serial, and software revision"
        - "Representative cutting test and customer sign-off complete before saleable status"
      epistemic_class: UNKNOWN
      evidence_ids: [ev_renishaw_metrology_scope, ev_cnc_metrology_research_question, ev_cnc_qualification_schedule_assumption]
      human_approval_required: true

  research_tasks:
    - id: rq_vmc_qualified_effective_capacity
      title: "Verify qualified effective output of the exact reference VMC"
      question: "Which Indian facility can demonstrate 100 saleable units/year of this exact three-axis VMC architecture, after availability, utilization, yield, supplier allocation, and customer qualification?"
      target_entity_id: cnc_vmc_high_quality
      missing_variable: qualified_effective_capacity
      decision: "Whether the 100/year objective is executable without treating installed/nameplate capacity as supply"
      priority: HIGH
      suggested_source_types: [supplier_audit, audited_filing, customer_acceptance_records, production_schedule]
      capture_fields: [facility_id, product_compat, machine_hours, availability, utilization, yield, qualification_fraction, valid_from, valid_to]
    - id: rq_ballscrew_grade_and_supplier
      title: "Resolve ball-screw grade and supplier qualification"
      question: "For the selected travel/lead/preload and thermal budget, who can quote C3 or C5 ground ball screws with lot-level lead-error maps, runout, life, and traceability?"
      target_entity_id: ball_screw_set
      missing_variable: grade_specific_qualified_supply
      decision: "Select a grade/supplier route or redesign the axis error budget"
      priority: HIGH
      suggested_source_types: [technical_RFI, supplier_capability_audit, first_article_test, calibration_records]
      capture_fields: [grade, lead, preload, lead_error_map, runout, life_test, lot_traceability, allocation, lead_time, qualification_status]
    - id: rq_ballscrew_grinder_machine_hours
      title: "Verify grinder ownership, process envelope, and machine-hour allocation"
      question: "Which Indian facility owns or can procure a thread/ball-screw grinder, dressing system, temperature control, and qualified process owner, and what machine-hours are reservable for this programme?"
      target_entity_id: ball_screw_grinder
      missing_variable: qualified_machine_hours
      decision: "Fund/build/partner for a grinder or keep the route external"
      priority: HIGH
      suggested_source_types: [site_visit, equipment_register, supplier_audit, maintenance_logs, process_capability_study]
      capture_fields: [equipment_id, facility_id, axis_envelope, dressing_system, thermal_control, availability, utilization, process_capability, operator_skill, reserved_hours]
    - id: rq_ballscrew_metrology_throughput
      title: "Verify traceable ball-screw metrology throughput"
      question: "Which lab/service team can measure lead error, pitch, runout, backlash, preload, and thermal drift for 300 axis sets/year, with traceable calibration and uncertainty budgets?"
      target_entity_id: ball_screw_metrology_station
      missing_variable: metrology_throughput_and_traceability
      decision: "Qualify an internal station, supplier service, or additional metrology investment"
      priority: HIGH
      suggested_source_types: [calibration_scope, lab_audit, equipment_register, uncertainty_budget, sample_report]
      capture_fields: [instrument_id, calibration_scope, uncertainty, cycle_time, annual_capacity, environmental_control, traceability, customer_acceptance]
    - id: rq_spindle_bearing_machine_tool_grade
      title: "Resolve machine-tool spindle-bearing grade and allocation"
      question: "Which supplier can deliver the selected angular-contact spindle-bearing grade, preload pair, life, runout, lubrication, and serial traceability with an allocation for 100 machines/year?"
      target_entity_id: spindle_bearing
      missing_variable: grade_specific_qualified_capacity
      decision: "Make/buy/qualify spindle bearings and freeze spindle design"
      priority: HIGH
      suggested_source_types: [supplier_RFI, quality_agreement, bearing_test_report, customer_reference, allocation_letter]
      capture_fields: [bearing_grade, preload_class, speed_rating, runout, life, lubrication, traceability, allocation, qualification_status]
    - id: rq_final_acceptance_service
      title: "Verify 100-machine/year acceptance and calibration service"
      question: "Which India-based lab or service team can execute traceable laser interferometer, ballbar, spindle thermal, CMM, and cutting-test acceptance for 100 machines/year?"
      target_entity_id: metrology_acceptance_kit
      missing_variable: machine_acceptance_throughput
      decision: "Build an internal metrology cell, contract a service, or change the ramp plan"
      priority: HIGH
      suggested_source_types: [calibration_scope, service_quote, sample_acceptance_record, instrument_certificate, customer_audit]
      capture_fields: [service_provider, instrument_ids, calibration_dates, uncertainty, cycle_time, annual_capacity, travel_window, customer_acceptance]
    - id: rq_synrm_architecture_alternative
      title: "Prototype the magnet-lean synchronous-reluctance axis alternative"
      question: "Can a synchronous-reluctance axis motor and compatible drive meet the signed torque-speed, thermal, acoustic, efficiency, encoder, and positioning envelope without permanent magnets?"
      target_entity_id: servo_motor_axis_synrm
      missing_variable: alternative_architecture_equivalence
      decision: "Retain the PM motor route or execute the graph rewrite and requalify the axis"
      priority: MEDIUM
      suggested_source_types: [prototype_test, dyno_test, thermal_test, controller_HIL, customer_acceptance]
      capture_fields: [torque_speed_curve, thermal_map, efficiency, acoustic, torque_ripple, encoder_compatibility, drive_revision, qualification_status]

