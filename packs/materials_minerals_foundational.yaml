      - {id: bof, name: "BOF oxygen blow", equipment_classes: [bof_converter], yield_fraction: 0.95}
      - {id: cc, name: "Continuous cast", equipment_classes: [continuous_caster], yield_fraction: 0.97}
    inputs:
      - {id: mat_iron_ore_lump, quantity: [1.55, t_ore]}
