pack_id: materials_minerals_foundational
title: "Foundational materials & minerals layer for FORGE WORLD (upstream of all benchmark packs)"
version: 0.1.0
geography_focus: GLOBAL
notes: >
  Cross-pack upstream materials/minerals layer built by the industrial-knowledge
  foundry (workstream 07). Anchors are world-state claims verified during the
  2026-08-24 build run (PIB/Ministry of Steel, MOFCOM, IEA, USGS-landing,
  Benchmark, CPIA-synthesis, ATA-2025, company disclosures). Recipe coefficients
  are transparent engineering ASSUMPTIONS that expose gross-up structure, not
  observed plant data. No factory existence, reserve, trade flow, or nameplate
  is promoted into qualified effective capacity; those remain UNKNOWN where
  evidence is absent. India-specific depth (Ti sponge single-plant, copper
  import dependence, REE separation gap) is evidence-linked below.

