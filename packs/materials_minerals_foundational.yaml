shocks:
  - id: shk_mofcom_ree_2025
    name: "China REE/magnet export-control licensing (MOFCOM #18, 2025-04-04)"
    description: >
      License regime on 7 medium/heavy REEs incl. oxides, alloys, NdFeB and TbDyFe
      magnets. Modeled as import-eligibility reduction on China-origin separated
      REE and magnet items rather than full embargo (licenses granted case-by-case).
    evidence_ids: [c10_mofcom18]
    edits:
      - {type: import_eligibility, origin: CHN, fraction: 0.25, items: [mat_ndfeb_block, mat_ndpr_oxide, mat_dy_oxide]}
  - id: shk_drc_cobalt_quota
    name: "DRC cobalt export quota regime (2025-2027)"
    description: >
      Ban Feb-Oct 2025 then quotas (18,125 t 2025; 96,600 t/yr 2026-27). Modeled as
      origin availability reduction on DRC cobalt hydroxide.
    evidence_ids: [c07_drc_share, c07_drc_quota]
    edits:
      - {type: import_eligibility, origin: COD, fraction: 0.6, items: [mat_co_hydroxide]}
  - id: shk_kmml_sponge_outage
    name: "KMML Ti sponge outage (single-point scenario)"
    description: "Scenario loss of India's only Ti sponge plant."
    evidence_ids: [c05_kmml_sponge, c05_orf_bottleneck]
    edits:
      - {type: equipment_limit, equipment_class: kroll_retort_furnace, hours_per_year: 0, facility_id: fac_kmml_chavara}
  - id: shk_tuticorin_precedent
    name: "Tuticorin closure precedent (policy shock class)"
    description: "Historical: 400 kt smelter closed by state order; national copper trade flipped within a year."
    evidence_ids: [c04_tuticorin_shock]
    edits:
