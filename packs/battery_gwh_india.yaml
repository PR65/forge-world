    name: NMC cell route
    output_part: battery_cell_ncm
    output_quantity: [1, "pcs"]
    maturity: series
    applicable_geographies: [INDIA, GLOBAL]
    steps:
      - id: mix_coat
        name: electrode mixing/coating/calendering
        equipment_classes: [coating_line_batt]
        yield_fraction: 0.95
      - id: assembly_dry_room
        name: cell assembly (dry room)
        equipment_classes: [dry_room_line]
        yield_fraction: 0.94
      - id: formation_aging
        name: formation + aging
        equipment_classes: [formation_bank]
        yield_fraction: 0.96
    inputs:
      - id: lithium_carbonate_bg
        quantity: [0.6, "kg_product"]
      - id: nickel_sulfate
        quantity: [1.1, "kg_product"]
      - id: cobalt_sulfate
        quantity: [0.35, "kg_product"]
      - id: graphite_anode
        quantity: [0.95, "kg_product"]
      - id: separator_film
        quantity: [0.12, "kg_product"]
      - id: electrolyte_li
        quantity: [0.11, "kg_product"]
      - id: copper_foil
        quantity: [0.09, "kg_product"]
      - id: aluminium_foil
        quantity: [0.06, "kg_product"]

  - id: rec_cell_lfp
    name: LFP cell route
    output_part: battery_cell_lfp
    output_quantity: [1, "pcs"]
    maturity: series
    applicable_geographies: [GLOBAL]
    steps:
      - id: mix_coat_lfp
        name: electrode mixing/coating/calendering
        equipment_classes: [coating_line_batt]
        yield_fraction: 0.95
      - id: assembly_dry_lfp
        name: cell assembly (dry room)
        equipment_classes: [dry_room_line]
        yield_fraction: 0.94
      - id: formation_lfp
        name: formation + aging
        equipment_classes: [formation_bank]
        yield_fraction: 0.96
    inputs:
      - id: lithium_carbonate_bg
        quantity: [0.55, "kg_product"]
      - id: iron_phosphate_bg
        quantity: [1.35, "kg_product"]
      - id: graphite_anode
        quantity: [0.9, "kg_product"]
      - id: separator_film
        quantity: [0.13, "kg_product"]
      - id: electrolyte_li
        quantity: [0.12, "kg_product"]
      - id: copper_foil
        quantity: [0.1, "kg_product"]
      - id: aluminium_foil
        quantity: [0.09, "kg_product"]

  - id: rec_pack_ev80
    name: EV pack assembly
    output_part: battery_pack_ev80
    output_quantity: [1, "pcs"]
    maturity: pilot
    applicable_geographies: [INDIA]
    steps:
      - id: module_build
        name: module build + laser weld
        equipment_classes: [pack_line]
        yield_fraction: 0.97
      - id: eol_safety
        name: EOL safety/hipot
        yield_fraction: 0.995
    inputs:
      - id: bms_master
        quantity: [1, "pcs"]

capacity_segments:
