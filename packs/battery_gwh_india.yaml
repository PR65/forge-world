    from_code: "8507.60"
    to_entity: battery_cell_ncm
    confidence: 0.55
    note: Li-ion accumulator heading; chemistry not separable
  - from_class: HS
    from_code: "2827.39"
    to_entity: cobalt_sulfate
    confidence: 0.4
    note: cobalt oxides/hydroxides family
