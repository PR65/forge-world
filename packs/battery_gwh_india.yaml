pack_id: battery_gwh_india
title: "Domain pack 2: India 40 GWh/yr battery cell industrialization by 2030"
version: 1.0.0
geography_focus: INDIA
notes: >
  Material/process-heavy contrast pack grounded in evidenced policy data (ACC PLI).
  Demonstrates chemistry substitutions (NMC->LFP->Na-ion), recycling as secondary
  production, and purity-ladder constraints. Awarded capacity is NOT operating capacity.

sources:
  - id: src_pib_acc_pli
    name: PIB — PLI scheme for Advanced Chemistry Cells
    publisher: Press Information Bureau, Government of India
    url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2224542"
    source_type: government_release
    license: public domain (Government of India)
    access_date: "2026-08-22"
  - id: src_swarajya_minerals
    name: Swarajya critical-minerals reporting
    publisher: Swarajya (Kovai Media)
    url: "https://swarajyamag.com/economy/how-india-is-confronting-its-vulnerability-in-critical-mineral-supply-chains"
    source_type: secondary_reporting
    license: referenced
    access_date: "2026-08-22"
  - id: src_iea_minerals
    name: IEA — The Role of Critical Minerals in Clean Energy Transitions / Outlook 2026
    publisher: International Energy Agency
    url: "https://www.iea.org/reports/global-critical-minerals-outlook-2026/executive-summary"
    source_type: intergovernmental_analysis
    license: CC BY 4.0 (per IEA)
    access_date: "2026-08-22"
  - id: src_nature_recycling
    name: Nature — Lithium-ion battery recycling perspective
    publisher: Nature
    url: "https://www.nature.com/articles/s44296-025-00083-7"
    source_type: peer_reviewed
    license: referenced
    access_date: "2026-08-22"

evidence:
  - claim_id: ev_acc_pli_50gwh
    subject: india_acc_pli
    predicate: programme_target
    epistemic_class: REPORTED
    value_quantity: [50, "GWh/yr"]
    value_text: "ACC PLI targets 50 GWh domestic ACC manufacturing; ~40 GWh awarded to four beneficiaries by early 2026"
    source_ids: [src_pib_acc_pli]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.9, directness: 0.85, recency: 0.9}
    quote_or_caveat: Awarded != commissioned; chemistry mix per beneficiary not fully public
  - claim_id: ev_china_refining_share
    subject: global_battery_material_refining
    predicate: china_concentration
    epistemic_class: REPORTED
    value_text: "China holds dominant refining shares across lithium, cobalt, nickel and graphite battery chains (~90% class for graphite/REE processing)"
    source_ids: [src_iea_minerals, src_swarajya_minerals]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.8, corroboration: 0.8}
  - claim_id: ev_recycling_incentive
    subject: india_recycling_programme
    predicate: target_recovery
    epistemic_class: REPORTED
    value_quantity: [40000, "t_product/yr"]
    value_text: "INR 1,500 cr recycling incentives targeting recovery of up to 40,000 t of critical minerals from secondary sources"
    source_ids: [src_swarajya_minerals]
    publication_date: "2025-12-18"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.55, directness: 0.6, corroboration: 0.4}
    quote_or_caveat: MEDIA-REPORTED; collection-rate reality is the binding unknown
  - claim_id: ev_lfp_tradeoff
    subject: lfp_substitution
    predicate: energy_density_penalty
    epistemic_class: REPORTED
    value_text: "LFP removes Ni/Co exposure vs NMC at ~20-40% lower volumetric energy density; Na-ion removes Li entirely at further density cost and immature ecosystem"
    source_ids: [src_iea_minerals]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.75, corroboration: 0.75}

