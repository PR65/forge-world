product_variants:
  - id: nmc_80kwh_pack_line
    name: 500k packs/yr of 80 kWh NMC packs (40 GWh/yr)
    anchor_evidence: [ev_acc_pli_50gwh]
    notes: "Objective framing: 500,000 packs x 80 kWh = 40 GWh annual output"
    functional_requirements:
      - metric: annual_energy_gwh
        min: 38
        max: 42
        unit: GWh
      - metric: cycle_life
        min: 1000
        max: 4000
        unit: cycles
    bom:
      - part: battery_cell_ncm
        qty: 440
      - part: bms_master
        qty: 1
      - part: busbar_set
        qty: 1
      - part: pack_enclosure
        qty: 1

recipes:
