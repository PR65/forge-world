    item_id: pack_enclosure
    geography: INDIA
    nameplate_annual: [600000, "pcs/yr"]
    availability: 0.88
    utilization: 0.8
    yield_fraction: 0.96
    qualification_fraction: 0.8
    valid_from: 2024
    epistemic_class: ESTIMATED
    notes: Order-of-magnitude prior from India's sheet-metal/battery-adjacent fabrication base (C13)
    evidence_ids: []

projects:
  - id: prj_acc_cells_awarded
    name: ACC PLI awarded cell plants (four beneficiaries)
    item_id: battery_cell_ncm
    state: approved
    state_date: "2026-02-01"
    earliest_start_year: 2026
    years_to_commission: [2.0, 4.0]
    design_capacity_annual: [440000000, "pcs/yr"]
    ramp_points: [[0, 0.25], [2, 0.8], [4, 1.0]]
    evidence_ids: [ev_acc_pli_50gwh]

demand_pools:
  - id: dp_lithium_global
    resource_id: lithium_carbonate_bg
    baseline_annual: [900000, "t_product/yr"]
    contestable_fraction: 0.15
    note: Global battery-grade Li2CO3/LiOH pool order-of-magnitude prior (ASSUMPTION basis)
  - id: dp_graphite_global
    resource_id: graphite_anode
    baseline_annual: [1200000, "t_product/yr"]
    contestable_fraction: 0.15

shocks:
  - id: shk_graphite_controls
    name: Graphite export controls tighten
    description: Chinese anode-material exports cut to 50% eligibility
    edits:
      - type: import_eligibility
        origin: CHN
        fraction: 0.5
  - id: shk_lithium_spike
    name: Lithium price spike x2.5
    description: Cost multiplier on Li feedstock
    edits:
      - type: cost_multiplier
        item: lithium_carbonate_bg
        factor: 2.5
        side: both

substitutions:
  - id: sub_nmc_to_lfp
    name: Chemistry switch NMC -> LFP
    replaces_part: battery_cell_ncm
    alternative_recipe: rec_cell_lfp
    level: component
    functional_envelope:
      annual_energy_gwh: [38, 42]
      cycle_life: [3000, 6000]
    performance_delta:
      volumetric_density: "-20-40% (REPORTED)"
      thermal_stability: "+improved"
      cobalt_nickel_exposure: "eliminated"
    changed_bom:
      - part: battery_cell_lfp
        qty: 520
    new_equipment: []
    new_skills: [lfp_cell_process_control]
    maturity: series
    transition_months: [12, 24]
    evidence_ids: [ev_lfp_tradeoff]
    notes: >
      LFP is mature globally; India-side qualification/form-factor fit remains a
      transition cost. Removes Ni/Co sulfate dependency entirely.

resource_classes:
  - id: graphite_chain
    category: raw_material
    unit: t_product
    supplied_by_countries: [CHN]
    concentration_hhi: 0.85

crosswalks:
