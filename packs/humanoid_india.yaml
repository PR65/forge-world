    subject: unitree_g1
    predicate: joint_motor_configuration
    epistemic_class: REPORTED
    value_text: "~35 kg class; configurations with 23-43 joint motors; industrial-grade crossed-roller bearings; dual encoders"
    source_ids: [src_unitree_g1]
    publication_date: "2025-06-01"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.8, directness: 0.9, recency: 0.9, technical_specificity: 0.85}
