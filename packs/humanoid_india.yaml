  - claim_id: ev_h1_battery
    subject: unitree_h1
    predicate: battery_energy
    epistemic_class: REPORTED
    value_quantity: [864, "Wh"]
    value_text: "864 Wh replaceable battery; ~47 kg mass"
    source_ids: [src_unitree_h1]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.8, directness: 0.95, recency: 0.9}
  - claim_id: ev_figure03_pack
