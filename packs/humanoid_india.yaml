substitutions:
  - id: sub_ree_free_actuation
    name: Rare-earth-reduced body actuation (SynRM/ferrite-assisted)
    replaces_part: bldc_servo_motor
    alternative_recipe: rec_bldc_servo_synrm
    level: component
    functional_envelope:
      torque_density_nm_kg: [150, 220]
      powered_joints: [30, 50]
      runtime_h: [4, 8]
      payload_kg: [15, 25]
      backlash_arcmin: [0.5, 1.0]
    performance_delta:
      torque_density: "-15% vs NdFeB PMSM (REPORTED tradeoff)"
      inverter_demand: "+SiC stages required"
      mass: "+4-6% actuator mass"
    changed_bom:
      - part: sic_power_stage
        qty: 44
    new_equipment: []
    new_skills: [advanced_motor_control_software]
    maturity: pilot
    transition_months: [18, 36]
    transition_cost_usd: 250000000
    evidence_ids: [ev_synrm_tradeoff]
    notes: >
      Validated contract: envelope covers HV-2 requirements; removes NdFeB content from
      body motors (hand/micro actuators unchanged); adds SiC dependency — substitution
      trades one concentrated input for another (corpus lesson).
  - id: sub_body_actuator_rv_reducer
    name: "Body actuator rewrite: harmonic route to RV/cycloidal reducer family"
    replaces_part: actuator_rotary_body
    alternative_recipe: rec_joint_actuator_rv
    level: component
    functional_envelope:
      torque_density_nm_kg: [140, 260]
      powered_joints: [30, 50]
      runtime_h: [4, 8]
      payload_kg: [15, 25]
      backlash_arcmin: [0.5, 1.0]
    performance_delta:
      backlash: "same target envelope; fatigue/life qualification is OPEN"
      mass: "+6-12% body actuator mass (MODELLED; validate by design)"
      thermal: "different reducer losses and lubrication envelope (MODELLED)"
      qualification: "new reducer-family integration and customer life testing required"
    changed_bom: []
    new_equipment: [rv_reducer_assembly_cell, reducer_life_test_cell, backlash_test_bench]
    new_skills: [cycloidal_profile_design, reducer_fatigue_life_testing]
    maturity: pilot
    transition_months: [18, 36]
    transition_cost_usd: 180000000
    evidence_ids: [ev_nabtesco_rv_scope, ev_precision_motion_capacity_unknown]
    notes: >
      Genuine graph rewrite for body actuators: the body route replaces harmonic_reducer
      and its flexspline/bearing-steel dependency with rv_reducer, RV pin/case steels,
      and a different grinding/life-test chain. Hand micro-actuators remain on their
      baseline route unless a separate hand rewrite is selected.
  - id: sub_ree_free_hand_actuation
    name: "Dexterous-hand rewrite: micro BLDC/harmonic route to rare-earth-reduced motor"
    replaces_part: micro_actuator_hand
    alternative_recipe: rec_micro_actuator_hand_ree_free
    level: component
    functional_envelope:
      torque_density_nm_kg: [120, 220]
      powered_joints: [30, 50]
      runtime_h: [4, 8]
      payload_kg: [15, 25]
      backlash_arcmin: [0.5, 1.0]
    performance_delta:
      torque_density: "-15% vs NdFeB micro-motor route (MODELLED tradeoff)"
      inverter_demand: "+SiC stage and control-bandwidth burden"
      hand_force: "qualification required; no public humanoid evidence"
    changed_bom: []
    new_equipment: [micro_lamination_press, micro_eol_dyno]
    new_skills: [advanced_motor_control_software, dexterous_hand_thermal_design]
    maturity: pilot
    transition_months: [18, 36]
    transition_cost_usd: 90000000
    evidence_ids: [ev_synrm_tradeoff, ev_precision_motion_capacity_unknown]
    notes: >
      Removes the BLDC and harmonic-reducer path from hand micro-actuators and adds
      electrical steel, copper, and SiC power-stage demand. Select with sub_ree_free_actuation
      when the scenario requires no Chinese permanent magnets across both body and hands.

