    output_part: micro_actuator_hand
    output_quantity: [1, "pcs"]
    route_type: secondary
    maturity: pilot
    applicable_geographies: [GLOBAL]
    requires_qualification: [qual_hand_actuator_robot_grade]
    notes: >
      Architecture alternative for dexterous-hand micro-actuators. It removes the
