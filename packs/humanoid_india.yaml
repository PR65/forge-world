        equipment_classes: [winding_line, rotor_balance_cell]
        yield_fraction: 0.94
      - id: rv_reducer_integration
        name: RV reducer integration and preload setting
        equipment_classes: [rv_reducer_assembly_cell]
        yield_fraction: 0.88
      - id: rv_cal_test
        name: calibration, backlash, thermal, and EOL dyno test
        equipment_classes: [eol_dyno_tester, backlash_test_bench]
        cycle_time_per_unit: [0.2, "h"]
        yield_fraction: 0.88
    inputs:
      - id: bldc_servo_motor
        quantity: [1, "pcs"]
      - id: rv_reducer
        quantity: [1, "pcs"]
      - id: crossed_roller_bearing
        quantity: [2, "pcs"]
      - id: absolute_encoder
