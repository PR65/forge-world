    maturity: pilot
    applicable_geographies: [GLOBAL]
    requires_qualification: [qual_actuator_robot_grade, qual_rv_reducer_robot_grade]
    notes: >
      Architecture alternative for body joints only. It preserves the actuator interface
      while replacing the harmonic/flexspline dependency with an RV reducer family;
      integration, life, thermal, and customer qualification are not demonstrated for humanoids.
    steps:
      - id: rv_stator_winding
