evidence:
  - claim_id: ev_g1_config
    subject: unitree_g1
    predicate: joint_motor_configuration
    epistemic_class: REPORTED
    value_text: "~35 kg class; configurations with 23-43 joint motors; industrial-grade crossed-roller bearings; dual encoders"
    source_ids: [src_unitree_g1]
    publication_date: "2025-06-01"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.8, directness: 0.9, recency: 0.9, technical_specificity: 0.85}
    quote_or_caveat: Manufacturer-published configuration; exact reducer counts per joint not published
  - claim_id: ev_h1_battery
    subject: unitree_h1
    predicate: battery_energy
    epistemic_class: REPORTED
    value_quantity: [864, "Wh"]
    value_text: "864 Wh replaceable battery; ~47 kg mass"
    source_ids: [src_unitree_h1]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.8, directness: 0.95, recency: 0.9}
  - claim_id: ev_figure03_pack
    subject: figure_03
    predicate: battery_and_mass
    epistemic_class: REPORTED
    value_quantity: [2.3, "kWh"]
    value_text: "61 kg; payload 20 kg; F.03 battery 2.3 kWh; ~5 h runtime"
    source_ids: [src_figure03]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.75, directness: 0.9, recency: 0.95}
  - claim_id: ev_figure_yield
    subject: figure_manufacturing
    predicate: first_pass_yield_eol
    epistemic_class: REPORTED
    value_quantity: [80, "%"]
    value_text: "company-reported EOL first-pass yield >80%; battery line FPY 99.3%; 9,000+ actuators across 10+ SKUs; 1/day to 1/hr in <120 days"
    source_ids: [src_figure03]
    publication_date: "2026-01-01"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.6, directness: 0.7, corroboration: 0.3, recency: 0.95}
    quote_or_caveat: COMPANY-REPORTED, not independently verified; demonstrates that throughput/yield/SKU mix are separate state variables
  - claim_id: ev_addverb_wheeled
    subject: addverb_elixis_w
    predicate: platform_status
    epistemic_class: REPORTED
    value_text: "India's first commercial WHEELED humanoid announced Feb 2026; pilot rollout of ~100 units; not a bipedal general-purpose humanoid"
    source_ids: [src_addverb]
    publication_date: "2026-02-01"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.7, directness: 0.85, recency: 0.95}
  - claim_id: ev_repm_scheme
    subject: india_repm_programme
    predicate: target_capacity
    epistemic_class: REPORTED
    value_quantity: [6000, "t_product/yr"]
    value_text: "INR 7,280 cr programme for integrated domestic sintered NdFeB capacity (oxide->metal->alloy->magnet); 20 bids received by 13 Aug 2026; current demand met via imports"
    source_ids: [src_pib_repm, src_swarajya_minerals]
    publication_date: "2026-07-17"
    effective_date: "2026-07-17"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.9, directness: 0.85, corroboration: 0.7, recency: 0.95}
    quote_or_caveat: Scheme TARGET is observed; realized capacity, grade compatibility and yields are future/UNKNOWN states
  - claim_id: ev_ndfeb_imports
    subject: india_ndfeb_imports
    predicate: annual_imports_fy2024_25
    epistemic_class: REPORTED
    value_quantity: [54000, "t_product/yr"]
    value_text: "India imported approximately 54,000 t of rare-earth permanent magnets in FY 2024-25"
    source_ids: [src_swarajya_minerals]
    publication_date: "2025-12-18"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.5, directness: 0.6, corroboration: 0.4, geographic_specificity: 0.9}
    quote_or_caveat: MEDIA-REPORTED; pair with DGCI&S HS 8505 data before decision use
  - claim_id: ev_china_processing
    subject: global_rare_earth_processing
    predicate: china_share
    epistemic_class: REPORTED
    value_quantity: [90, "%"]
    value_text: "China controls ~90% of global rare-earth processing (refining/metal/alloy/magnet stages)"
    source_ids: [src_swarajya_minerals, src_iea_ree]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.75, directness: 0.65, corroboration: 0.85}
    quote_or_caveat: Broad direction strongly corroborated by IEA; precise share requires date/scope definition
  - claim_id: ev_cn_export_controls
    subject: china_rare_earth_exports
    predicate: export_control_state
    epistemic_class: REPORTED
    value_text: "Apr 2025 dual-use export controls covering seven medium/heavy REEs and related magnets; further items Oct 2025"
    source_ids: [src_swarajya_minerals]
    publication_date: "2025-04-04"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.7, directness: 0.7, recency: 0.9}
  - claim_id: ev_semicon_projects
    subject: india_semiconductor_pipeline
    predicate: approved_projects
    epistemic_class: REPORTED
    value_text: "12 semiconductor manufacturing projects approved as of Jul 2026 under first programme: 1 silicon fab (~50,000 wsp target, PSMC technology partner), 1 compound-semiconductor fab, 1 micro-LED/GaN fab, 9 ATMP/OSAT facilities; Semicon 2.0 outlay INR 1,27,500 cr approved 15 Jul 2026 including design/IP pillar"
    source_ids: [src_pib_semicon2]
    publication_date: "2026-07-15"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.95, directness: 0.9, recency: 0.95}
    quote_or_caveat: APPROVED projects are not operating capacity (C7); node/process compatibility with humanoid compute is UNKNOWN
  - claim_id: ev_acc_pli
    subject: india_acc_pli
    predicate: awarded_capacity
    epistemic_class: REPORTED
    value_quantity: [40, "GWh/yr"]
    value_text: "ACC PLI targets 50 GWh domestic cell manufacturing; ~40 GWh awarded to four beneficiaries by early 2026"
    source_ids: [src_pib_acc_pli]
    publication_date: "2025-11-01"
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.9, directness: 0.85, recency: 0.9}
    quote_or_caveat: Awarded ≠ commissioned; chemistry/form-factor compatibility with humanoids UNKNOWN
  - claim_id: ev_capital_goods
    subject: india_capital_goods_phase2
    predicate: programme_outlay
    epistemic_class: REPORTED
    value_text: "Phase II capital-goods competitiveness scheme INR 1,207 cr; includes Centre of Excellence on Machine Tools Design (IIT BHU/HMT)"
    source_ids: [src_mhi_capitalgoods]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.9, directness: 0.85}
  - claim_id: ev_qual_latency_aero
    subject: supplier_qualification_aerospace
    predicate: latency_months
    epistemic_class: REPORTED
    value_quantity: [6, "mo"]
    value_text: "new aerospace/defense supplier qualification typically 6-24 months under AS9100-class systems"
    source_ids: [src_bcg_aero, src_dod_mrl]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.7, corroboration: 0.7, completeness: 0.5}
    quote_or_caveat: Planning range, not a universal law; robot-sector customer qualification may be shorter but volume-grade approval is unproven
  - claim_id: ev_learning_curve
    subject: manufacturing_learning_curves
    predicate: progress_ratio_range
    epistemic_class: REPORTED
    value_text: "complex-system learning-curve progress ratios ~71-85% per cumulative doubling (econometric studies)"
    source_ids: [src_dod_mrl]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.75, corroboration: 0.75, completeness: 0.55}
  - claim_id: ev_humanoid_envelope
    subject: humanoid_architecture_envelope
    predicate: components_per_robot_range
    epistemic_class: ESTIMATED
    value_text: "class-level ranges 20-40 actuators / 30-50 reducers / 20-30 BLDC motors per robot (corpus stream estimates)"
    source_ids: [src_mckinsey_humanoid]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.5, directness: 0.4, corroboration: 0.5, technical_specificity: 0.35}
    quote_or_caveat: MODEL/ESTIMATE only; architecture-dependent; never present as measured requirement
  - claim_id: ev_bldc_market_india
    subject: india_bldc_market
    predicate: market_value_2025
    epistemic_class: ESTIMATED
    value_quantity: [487.7, "MUSD"]
    value_text: "India BLDC motor market ~USD 488M (2025) projected ~779M by 2030 (commercial market research)"
    source_ids: [src_corpus_streams]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.4, directness: 0.3, corroboration: 0.4}
    quote_or_caveat: Market VALUE is not unit capacity and says nothing about servo/humanoid grade
  - claim_id: ev_machine_tool_concentration
    subject: cnc_controls_market
    predicate: concentration
    epistemic_class: REPORTED
    value_text: "high-end CNC controls/drives dominated by FANUC (JP) and Siemens (DE); top-5 CNC vendors ~38% of global revenue (2025, commercial aggregation)"
    source_ids: [src_corpus_streams]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.5, corroboration: 0.6, completeness: 0.4}
    quote_or_caveat: Commercial market-research estimate; structural direction robust, percentages are not
  - claim_id: ev_synrm_tradeoff
    subject: synrm_actuation_substitution
    predicate: performance_tradeoff
    epistemic_class: REPORTED
    value_text: "synchronous-reluctance/ferrite-assisted motors remove heavy-REE dependence at cost of lower torque density and higher inverter/control demands"
    source_ids: [src_ieee_synrm, src_iea_ree]
    retrieval_date: "2026-08-22"
    confidence: {authority: 0.75, directness: 0.7, corroboration: 0.75}

