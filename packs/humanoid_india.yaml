research_tasks:
  - id: rt_humanoid_definition
    title: Lock the physical humanoid definition
    question: "Which mass, payload, duty cycle, mobility, safety, and dexterous-hand requirements define the counted unit?"
    target_entity_id: hv2_industrial
    missing_variable: definition_and_duty_cycle
    decision: "Determine whether the 1M/year target is bipedal industrial, general-purpose, or includes wheeled platforms."
    priority: critical
    suggested_source_types: [system_requirements, customer_duty_cycle, safety_standard, fleet_trial]
    capture_fields: [mass_kg, payload_kg, powered_joints, runtime_h, duty_cycle, mobility_class, hand_configuration, safety_envelope]
    status: UNKNOWN
  - id: rt_harmonic_capacity
    title: Audit robot-grade harmonic reducer capacity
    question: "What current qualified effective annual capacity is available for sub-arcminute harmonic/cycloidal reducers by size, geography, and customer allocation?"
    target_entity_id: harmonic_reducer
    missing_variable: qualified_effective_capacity_annual
    decision: "Quantify the dominant body/hand reducer bottleneck before accepting a 1M/year architecture."
    priority: critical
    suggested_source_types: [audited_filing, supplier_audit, line_walk, customer_qualification_record, export_allocation]
    capture_fields: [facility_id, line_count, nameplate_units_per_year, availability, utilization, yield, qualification_fraction, product_size_mix, exportable_share, committed_demand]
    evidence_ids: [ev_precision_motion_capacity_unknown]
    status: UNKNOWN
  - id: rt_rv_capacity
    title: Verify RV reducer alternative route
    question: "Can an RV/cycloidal supplier qualify the torque, backlash, thermal, noise, and life envelope required by HV-2 body joints, and at what effective rate?"
    target_entity_id: rv_reducer
    missing_variable: qualified_effective_capacity_and_envelope
    decision: "Decide whether the reducer-family redesign is a real closure option or only a catalog-level alternative."
    priority: critical
    suggested_source_types: [supplier_qualification, dynamometer_test, fatigue_test, process_capability_study, audited_filing]
    capture_fields: [torque_speed_map, backlash, lost_motion, life_cycles, thermal_loss, acoustic_limit, yield, line_rate, customer_acceptance]
    evidence_ids: [ev_nabtesco_rv_scope, ev_precision_motion_capacity_unknown]
    status: UNKNOWN
  - id: rt_joint_motor_capacity
    title: Establish humanoid-grade servo-motor capacity
    question: "Which motor plants can supply the joint torque-density, thermal, demagnetization, balance, life, and EOL-test envelope, and what is their uncommitted rate?"
    target_entity_id: bldc_servo_motor
    missing_variable: qualified_effective_capacity_annual
    decision: "Separate broad BLDC market activity from robot-joint-grade production."
    priority: critical
    suggested_source_types: [supplier_audit, product_test_report, customer_qualification_record, audited_filing]
    capture_fields: [motor_topology, torque_density, peak_continuous_torque, thermal_class, magnet_grade, balance_class, yield, test_cycle_time, annual_rate, committed_demand]
    evidence_ids: [ev_precision_motion_capacity_unknown]
    status: UNKNOWN
  - id: rt_magnet_chain
    title: Resolve NdFeB grade and upstream chain
    question: "What mine-to-oxide-to-alloy-to-sintered-magnet chain can deliver the required grade, yield, and non-CHN qualified volume by 2030?"
    target_entity_id: ndfeb_magnet
    missing_variable: grade_compatible_non_china_supply
    decision: "Determine whether permanent-magnet body or hand routes survive the no-Chinese-magnets scenario."
    priority: critical
    suggested_source_types: [government_material_balance, refinery_audit, magnet_supplier_qualification, assay_certificate, customs_primary_data]
    capture_fields: [ore_origin, beneficiation_recovery, separation_recovery, oxide_grade, metal_yield, alloy_yield, magnet_yield, heavy_ree_content, facility_country, exportable_share, qualification_status]
    evidence_ids: [ev_material_chain_unknown, ev_precision_motion_capacity_unknown]
    status: UNKNOWN
  - id: rt_bearing_capacity
    title: Quantify crossed-roller bearing allocation
    question: "What qualified crossed-roller bearing volume, size mix, preload class, and allocation is available for 60M+ joint/bearing demand?"
    target_entity_id: crossed_roller_bearing
    missing_variable: qualified_effective_capacity_annual
    decision: "Test whether bearing supply or raceway-grinding/metrology capacity binds before actuator assembly."
    priority: critical
    suggested_source_types: [supplier_audit, bearing_life_test, process_capability_study, customer_qualification_record]
    capture_fields: [bearing_size_mix, preload_class, runout, life_cycles, grinding_cycle_time, yield, line_rate, robot_allocation, exportable_share]
    evidence_ids: [ev_nsk_crossroller_scope, ev_precision_motion_capacity_unknown]
    status: UNKNOWN
  - id: rt_encoder_capacity
    title: Verify absolute encoder supply and qualification
    question: "What annual volume of dual/high-resolution absolute encoders is qualified for joint vibration, thermal, safety, and lifetime requirements?"
    target_entity_id: absolute_encoder
    missing_variable: qualified_effective_capacity_annual
    decision: "Resolve the encoder bottleneck instead of treating product catalogue presence as supply."
    priority: critical
    suggested_source_types: [supplier_audit, calibration_record, environmental_test, customer_qualification_record, audited_filing]
    capture_fields: [resolution, accuracy, interface, vibration_class, thermal_range, safety_level, yield, calibration_cycle_time, annual_rate, robot_allocation]
    evidence_ids: [ev_renishaw_encoder_scope, ev_precision_motion_capacity_unknown]
