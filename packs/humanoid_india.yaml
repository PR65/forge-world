product_variants:
  - id: hv2_industrial
    name: HV-2 industrial bipedal humanoid (50-60 kg class)
    anchor_evidence: [ev_figure03_pack, ev_g1_config, ev_humanoid_envelope]
    mass_kg: 58
    battery_kwh: 2.3
    notes: >
      Reference architecture anchored to published industrial-class platforms
      (Figure 03 energy/mass; G1 bearing/encoding practice). Joint counts follow the
      corpus envelope mid-range plus dexterous hands (7 active joints per hand,
      Dex3-1-style). This is a REFERENCE variant, not a canonical humanoid.
    functional_requirements:
      - metric: payload_kg
        min: 15
        max: 25
        unit: kg
      - metric: powered_joints
        min: 30
        max: 50
        unit: count
      - metric: runtime_h
        min: 4
        max: 8
        unit: h
      - metric: torque_density_nm_kg
        min: 140
        max: 300
        unit: N.m/kg
      - metric: backlash_arcmin
        min: 0
        max: 1
        unit: arcmin
