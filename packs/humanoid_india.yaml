shocks:
  - id: shk_cn_ree_minus80
    name: Chinese REE/magnet exports -80%
    description: Export-control tightening cuts eligible magnet imports to 20% of normal
    evidence_ids: [ev_cn_export_controls]
    edits:
      - type: import_eligibility
        origin: CHN
        fraction: 0.2
  - id: shk_exclude_china
    name: Exclude China from eligible imports
    description: Scenario policy sets all CHN-origin import eligibility to zero; it does not assert alternate supply or instant substitution.
    evidence_ids: [ev_cn_export_controls]
    edits:
      - type: import_eligibility
        origin: CHN
        fraction: 0.0
  - id: shk_no_chinese_permanent_magnets
    name: No Chinese permanent magnets
    description: >
      Country/material constraint used with rare-earth-reduced motor and hand-actuator
      rewrites. CHN-origin import eligibility is zeroed; the graph must still show any
      unreplaced magnet dependency and report that residual explicitly.
    evidence_ids: [ev_cn_export_controls, ev_material_chain_unknown]
    edits:
      - type: import_eligibility
        origin: CHN
        fraction: 0.0
  - id: shk_ndfeb_material_cut
    name: NdFeB project material shock -80%
    description: >
      Causal material shock cuts the design capacity of the announced integrated NdFeB
      project to 20%; the project state, ramp, and grade qualification remain unchanged.
    evidence_ids: [ev_repm_scheme, ev_material_chain_unknown]
    edits:
      - type: capacity_multiplier
        item: ndfeb_magnet
        factor: 0.2
  - id: shk_oil_150
    name: Oil at USD 150/bbl
    description: Energy/freight cost pass-through on imported content
    edits:
      - type: cost_multiplier
        item: "*"
        side: import
        factor: 1.35
  - id: shk_cu_double
    name: Copper price doubles
    description: Copper-bearing input costs double
    edits:
      - type: cost_multiplier
        item: copper_magnet_wire
        factor: 2.0
        side: both
  - id: shk_semi_half
