recipes:
  - id: rec_joint_actuator_body
    name: Body rotary actuator assembly (global primary route)
    output_part: actuator_rotary_body
    output_quantity: [1, "pcs"]
    route_type: primary
    maturity: series
    applicable_geographies: [GLOBAL]
    steps:
      - id: stator_winding
        name: stator winding
        equipment_classes: [winding_line]
        yield_fraction: 0.97
      - id: gearbox_assembly
        name: precision gearbox integration
        equipment_classes: [precision_assembly_cell]
        yield_fraction: 0.92
      - id: cal_test
        name: calibration + EOL test
        equipment_classes: [eol_dyno_tester]
        cycle_time_per_unit: [0.15, "h"]
        yield_fraction: 0.95
    inputs:
      - id: bldc_servo_motor
        quantity: [1, "pcs"]
      - id: harmonic_reducer
        quantity: [1, "pcs"]
      - id: crossed_roller_bearing
        quantity: [2, "pcs"]
