pack_id: humanoid_india
title: "Flagship: India 1,000,000 humanoid robots/yr by 2030"
version: 1.0.0
geography_focus: INDIA
notes: >
  Flagship domain knowledge pack. Evidence seeded from the supplied research corpus
  (access dates 2026-08-22). UNKNOWN capacity is deliberately left UNKNOWN where the
  corpus shows no adequate public evidence (humanoid-grade reducers, encoders,
  robot-grade motors). MODEL/ESTIMATE rows are planning assumptions, never observations.

