    predicate: policy_target
    epistemic_class: REPORTED
    value_quantity: [100, GW]
    value_text: "Government policy material reports a 100 GWe nuclear expansion ambition by 2047; this pack's 200 GW question is a FORGE scenario, not that reported target."
    source_ids: [src_pib_nuclear_100gwe]
    publication_date: "2025-12-01"
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.9, directness: 0.85, recency: 0.85}
    quote_or_caveat: Policy ambition is not commissioned capacity and does not validate a 200 GW schedule.
  - claim_id: ev_nuclear_700mwe_phwr
    subject: india_phwr_architecture
    predicate: reference_reactor_scale
    epistemic_class: REPORTED
    value_quantity: [700, MW]
    value_text: "Official programme material references 700 MWe PHWR units alongside other reactor technologies; this is an architecture/scale context, not a measured annual build rate."
    source_ids: [src_pib_nuclear_100gwe, src_npcil_fleet]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.9, directness: 0.8, corroboration: 0.8}
    quote_or_caveat: Unit nameplate and fleet programme evidence do not establish component capacity or construction throughput.
  - claim_id: ev_nuclear_smrs_context
