product_variants:
  - id: reactor_island_1gw_annual
    name: "One 1-GW-equivalent reactor-island kit/year (annualized slice)"
    anchor_evidence: [ev_nuclear_kit_architecture, ev_nuclear_bom_quantities, ev_nuclear_200gw_scenario]
    notes: >
      Annual objective framing: 1 kit/year is a flow proxy for approximately 1 GW
      nameplate-equivalent reactor-island manufacturing. It is not 1 GW cumulative
      installed generation, and the 200 GW question is not a policy claim. The
      simplified BOM intentionally exposes pressure-boundary, heavy-forging,
      steam-generator, channel, safety, turbine, civil, inspection, and
      qualification dependencies.
    functional_requirements:
      - metric: annualized_nameplate_capacity_per_kit
        min: 0.9
        max: 1.1
        unit: GW
      - metric: annual_kit_flow
        min: 1
        max: 1
        unit: units/yr
      - metric: architecture_class
        min: 1
        max: 1
        unit: PHWR_like_scenario
      - metric: cumulative_installed_generation
        min: 0
        max: 0
        unit: NOT_MODELED
    bom:
      - part: reactor_pressure_boundary
        qty: 1
      - part: calandria_and_core
        qty: 1
      - part: pressure_tube_set
        qty: 1
      - part: steam_generator
        qty: 4
      - part: primary_coolant_pump
        qty: 4
      - part: reactor_shutdown_system
        qty: 2
      - part: safety_injection_system
        qty: 1
      - part: containment_liner
        qty: 1
      - part: nuclear_instrumentation_set
        qty: 1
      - part: turbine_generator_set
        qty: 1
      - part: plant_electrical_system
        qty: 1
      - part: condenser_feedwater_set
