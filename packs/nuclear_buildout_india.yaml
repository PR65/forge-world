    epistemic_class: REPORTED
    value_text: "BHEL's public product material reports nuclear steam generators/reactor headers to ASME Section III NB Class 1 and turbine/generator offerings up to the 700 MWe class; no annual effective capacity is stated here."
    source_ids: [src_bhel_products]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.8, directness: 0.85, technical_specificity: 0.8}
    quote_or_caveat: Product page and standard scope are not a demonstrated delivery rate, current utilization, yield, or customer allocation.
  - claim_id: ev_bhel_order_context
    subject: bhel_npcil_order
    predicate: order_quantity
    epistemic_class: REPORTED
    value_quantity: [12, pcs]
    value_text: "BHEL public order reporting references 12 nuclear steam generators and 32 reactor-header assemblies for NPCIL fleet-mode orders; an order is not operating capacity or a recurring annual rate."
