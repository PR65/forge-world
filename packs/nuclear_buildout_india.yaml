# one-kit flow benchmark; this section is intentionally explicit about which
# rows are reported project context versus scenario timing/scale assumptions.
program_model:
  id: india_nuclear_buildout_2026_2047
  schema_version: forge.program_model.v1
  name: "India nuclear multi-year industrial buildout model"
  epistemic_class: SCENARIO
  limitations:
    - "The residual fleet required to close 200 GW is UNKNOWN and is intentionally excluded from numeric tranche arithmetic."
    - "Cumulative installed capacity is a programme-layer stock calculation, not an operating-generation, dispatch, or retirements model."
    - "Project/site rows do not create qualified equipment supply; capacity segments remain absent unless independently evidenced."
  notes: >
    This is a FORGE scenario program model. Reported installed capacity and project
    observations are retained as context, while construction/commissioning windows,
    residual capacity, and system-gate durations are transparent assumptions. The
    program layer distinguishes annual production/commissioning flow from cumulative
    installed nameplate stock; it does not claim operating generation or financing
    closure.
  timeline_semantics:
    construction_years: "Duration range from tranche/site start_year to construction completion."
    commissioning_years: "Duration range after construction completion before commissioning; it is not an operating-capacity guarantee."
    commissioning_window: "Optional inclusive calendar-year window retained for official/context rows."
    earliest_year: "Decision/availability anchor for the row, not proof that work started."
  objective:
    id: forge_200gw_nuclear_scenario
    target_gw: 200.0
    start_year: 2026
    target_year: 2047
    epistemic_class: SCENARIO
    evidence_ids: [ev_nuclear_200gw_scenario, ev_nuclear_program_model]
    existing_capacity_gw: 8.78
    existing_capacity_gw_metadata:
      unit: GWe
      epistemic_class: REPORTED
      evidence_ids: [ev_nuclear_current_capacity_878]
      notes: Existing installed nameplate context; not annual manufacturing supply.
    policy_comparator:
      id: government_100gwe_policy_context
      target_gw: 100.0
      target_year: 2047
      epistemic_class: REPORTED
      evidence_ids: [ev_nuclear_100gwe_policy]
      notes: Government policy context is distinct from the 200 GW FORGE scenario.
    accounting:
      annual_production_flow:
        semantic_class: FLOW
        unit: kits/yr
        represented_by: reactor_island_1gw_annual
        meaning: "Manufacturing/assembly output of reference kit units in a year."
        epistemic_class: SCENARIO
        evidence_ids: [ev_nuclear_kit_architecture]
      annual_nameplate_addition:
        semantic_class: FLOW
        unit: GWe/yr
        meaning: "Nameplate capacity commissioned in a year after site and qualification gates."
        epistemic_class: MODELLED
        notes: "Requires tranche commissioning and project-layer timing; not equal to recipe output."
      cumulative_installed_capacity:
        semantic_class: STOCK
        unit: GWe
        formula: "existing_capacity_gw + sum(commissioned tranche unit_capacity_gw * units) - retired_capacity_gw"
        epistemic_class: MODELLED
        notes: "Stock accounting is not a claim that the annual recipe solver models retirements or grid dispatch."
      operational_generation:
        semantic_class: FLOW
        unit: TWh/yr
        epistemic_class: UNKNOWN
        notes: "Capacity factor, outages, dispatch, and fuel availability are outside this pack's executable boundary."
