  - claim_id: ev_aerb_qa_gates
    subject: nuclear_component_qualification
    predicate: regulatory_qa
    epistemic_class: REPORTED
    value_text: "AERB publishes codes and guides spanning manufacturing, site construction, commissioning, and quality assurance for nuclear facilities."
    source_ids: [src_aerb_qa]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.9, directness: 0.9, technical_specificity: 0.85}
    quote_or_caveat: A regulatory guide defines gates; it does not prove that a named supplier has passed them for this kit.
  - claim_id: ev_nuclear_qualification_window
    subject: nuclear_supplier_qualification
    predicate: planning_latency
    epistemic_class: REPORTED
    value_text: "Advanced-manufacturing supplier/process qualification often spans approximately 6–24 months in the supplied research; nuclear component and regulator/customer gates can be longer and remain component-specific."
    source_ids: [src_research_07, src_aerb_qa]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.7, directness: 0.55, corroboration: 0.65}
    quote_or_caveat: Planning range only; no universal nuclear qualification law is asserted.
  - claim_id: ev_nuclear_kit_architecture
    subject: reactor_island_1gw_kit
    predicate: scenario_definition
    epistemic_class: SCENARIO
    value_quantity: [1, GW]
    value_text: "FORGE scenario definition: one reactor-island kit is treated as one approximately 1 GW nameplate-equivalent annualized kit for flow arithmetic. The boundary includes reactor island, turbine-generator balance of plant, and site civil package."
    source_ids: [src_pib_nuclear_100gwe, src_npcil_fleet]
    retrieval_date: "2026-08-24"
    confidence: {technical_specificity: 0.45}
    quote_or_caveat: This is a transparent model architecture, not a reported reactor design, plant bill of materials, or policy commitment.
  - claim_id: ev_nuclear_bom_quantities
    subject: reactor_island_1gw_kit
    predicate: scenario_bom_coefficients
    epistemic_class: ASSUMPTION
    value_text: "All top-level BOM and recursive recipe-input quantities are alpha engineering assumptions chosen to expose physical flow; examples include four steam generators, four primary coolant pumps, 392 pressure tubes, 500 t of heavy water, and route-level material/service coefficients."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {technical_specificity: 0.35}
    quote_or_caveat: Values are not inferred from NPCIL/BHEL project announcements.
  - claim_id: ev_nuclear_process_yields
    subject: nuclear_component_routes
    predicate: scenario_process_and_input_coefficients
    epistemic_class: ASSUMPTION
    value_text: "Per-step yields and recursive route-input quantities are transparent alpha assumptions used to expose gross-up and upstream requirements; measured nuclear manufacturing route data are not publicly inserted."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {technical_specificity: 0.3}
    quote_or_caveat: Replace yields and every recursive coefficient with route-specific qualified data after process and supplier audits.
  - claim_id: ev_nuclear_schedule_ranges
    subject: nuclear_alpha_schedule
    predicate: qualification_and_project_windows
    epistemic_class: ASSUMPTION
    value_text: "Qualification latencies and project windows in this pack are broad alpha schedule assumptions used to expose temporal gating; they are not measured supplier or project forecasts."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {technical_specificity: 0.25, completeness: 0.2}
    quote_or_caveat: Replace every range with component-, supplier-, site-, and regulator-specific evidence before execution.
  - claim_id: ev_nuclear_200gw_scenario
    subject: india_200gw_nuclear_question
    predicate: objective_framing
    epistemic_class: SCENARIO
    value_text: "The 200 GW question is an explicit FORGE scenario. The official policy context cited here is 100 GWe by 2047; this pack does not claim that India has adopted a 200 GW target."
    source_ids: [src_pib_nuclear_100gwe]
    retrieval_date: "2026-08-24"
    confidence: {authority: 0.9, directness: 0.9}
    quote_or_caveat: Scenario scaling is not evidence of projects, financing, sites, or supply.
  - claim_id: ev_nuclear_capacity_unknown
    subject: india_nuclear_manufacturing_capacity
    predicate: qualified_effective_capacity
    epistemic_class: UNKNOWN
    value_text: "This pack has no public evidence sufficient to assign qualified effective annual capacity for the full reactor-island kit or most decision-sensitive nuclear components."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {completeness: 0.15}
    quote_or_caveat: Product pages, approvals, and orders are retained as evidence context but not promoted to capacity segments.
  - claim_id: ev_nuclear_cumulative_unknown
    subject: nuclear_buildout_solver_boundary
    predicate: cumulative_generation_model
    epistemic_class: UNKNOWN
    value_text: "The current solver does not model cumulative installed GW, fleet retirements, reactor construction-site concurrency, grid dispatch, fuel-cycle stocks, or commissioning-to-grid timing."
    source_ids: []
    retrieval_date: "2026-08-24"
    confidence: {completeness: 0.9}
    quote_or_caveat: Annual kit flow output must not be displayed as cumulative generation capability.

