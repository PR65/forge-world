pack_id: nuclear_buildout_india
title: "Alpha benchmark: India multi-year nuclear buildout and PHWR industrial programme"
version: 1.1.0
geography_focus: INDIA
notes: >
  Honest multi-year industrial/build-rate representation toward the long-run 200 GW
  FORGE scenario. The recipe solver still models annual production flows of a
  transparent one-kit/year reference architecture; the program_model section adds
  explicit 2026-2047 tranches, site pipeline, system gates, and stock-versus-flow
  accounting for a generic program layer. It does not claim reactor operations,
  dispatch, inventory/WIP dynamics, financing closure, or a complete grid model.
  One reactor-island kit is a scenario unit representing approximately 1 GW of
  nameplate capacity, not a reported Indian reactor design or a government 200 GW
  commitment. The Government of India's 100 GWe by 2047 policy context remains
  separate from the 200 GW FORGE scenario. Public programme/project observations
  are retained as context, while no project is promoted to operating capacity and
  no qualified capacity segments are asserted where evidence is absent.

