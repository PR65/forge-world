product_variants:
  - id: reactor_island_1gw_annual
    name: "One 1-GW-equivalent reactor-island kit/year (annualized slice)"
    anchor_evidence: [ev_nuclear_kit_architecture, ev_nuclear_bom_quantities, ev_nuclear_200gw_scenario]
    notes: >
      Annual objective framing: 1 kit/year is a flow proxy for approximately 1 GW
      nameplate-equivalent reactor-island manufacturing. It is not 1 GW cumulative
      installed generation, and the 200 GW question is not a policy claim. The
      simplified BOM intentionally exposes pressure-boundary, heavy-forging,
      steam-generator, channel, safety, turbine, civil, inspection, and
      qualification dependencies.
    functional_requirements:
      - metric: annualized_nameplate_capacity_per_kit
        min: 0.9
        max: 1.1
        unit: GW
      - metric: annual_kit_flow
        min: 1
        max: 1
        unit: units/yr
      - metric: architecture_class
        min: 1
        max: 1
        unit: PHWR_like_scenario
      - metric: cumulative_installed_generation
        min: 0
        max: 0
        unit: NOT_MODELED
    bom:
      - part: reactor_pressure_boundary
        qty: 1
      - part: calandria_and_core
        qty: 1
      - part: pressure_tube_set
        qty: 1
      - part: steam_generator
        qty: 4
      - part: primary_coolant_pump
        qty: 4
      - part: reactor_shutdown_system
        qty: 2
      - part: safety_injection_system
        qty: 1
      - part: containment_liner
        qty: 1
      - part: nuclear_instrumentation_set
        qty: 1
      - part: turbine_generator_set
        qty: 1
      - part: condenser_feedwater_set
        qty: 1
      - part: site_civil_works_package
        qty: 1
      - part: fuel_channel_inspection_kit
        qty: 1

recipes:
  - id: rec_reactor_pressure_boundary
    name: Reactor pressure boundary, header, weld, NDT, and hydrotest route
    output_part: reactor_pressure_boundary
    output_quantity: [1, pcs]
    maturity: pilot
    applicable_geographies: [INDIA, GLOBAL]
    requires_qualification: [qual_pressure_boundary]
    evidence_ids: [ev_nuclear_process_yields, ev_aerb_qa_gates]
    steps:
      - id: pressure_forging
        name: Large shell forging and heat treatment
        equipment_classes: [heavy_forging_press, vacuum_induction_melt_furnace, vacuum_heat_treatment_furnace]
        cycle_time_per_unit: [120, h]
        yield_fraction: 0.9
      - id: pressure_machine
        name: Large-bore machining and datum preparation
        equipment_classes: [large_bore_cnc, heavy_precision_lathe]
        cycle_time_per_unit: [80, h]
        yield_fraction: 0.94
      - id: pressure_weld
        name: Qualified nuclear welding and heat treatment
        equipment_classes: [nuclear_welding_cell, vacuum_heat_treatment_furnace]
        cycle_time_per_unit: [60, h]
        yield_fraction: 0.95
      - id: pressure_ndt
        name: Volumetric NDT and hydrostatic pressure test
        equipment_classes: [ultrasonic_ndt_station, radiography_cell, hydrostatic_test_loop]
        cycle_time_per_unit: [40, h]
        yield_fraction: 0.97
    inputs:
      - id: large_forged_shell
        quantity: [1, pcs]
      - id: reactor_header
        quantity: [8, pcs]
      - id: nuclear_weld_material
        quantity: [1.5, t_product]

  - id: rec_large_forged_shell
    name: Large nuclear-grade pressure-boundary forging
    output_part: large_forged_shell
    output_quantity: [1, pcs]
    maturity: pilot
    applicable_geographies: [INDIA, GLOBAL]
    requires_qualification: [qual_large_forging]
    evidence_ids: [ev_nuclear_process_yields, ev_nuclear_capacity_unknown]
    steps:
      - id: ingot_melt
        name: Vacuum melt, refine, and cast ingot
        equipment_classes: [vacuum_induction_melt_furnace, vacuum_arc_remelt_furnace]
        cycle_time_per_unit: [80, h]
        yield_fraction: 0.9
      - id: ingot_forge
        name: Heavy forging and upset/close-die operations
        equipment_classes: [heavy_forging_press, forging_manipulator]
        cycle_time_per_unit: [100, h]
        yield_fraction: 0.92
      - id: ingot_heat_treat
        name: Vacuum heat treatment and tempering
        equipment_classes: [vacuum_heat_treatment_furnace]
        cycle_time_per_unit: [48, h]
        yield_fraction: 0.96
      - id: ingot_ndt
        name: Forging ultrasonic and dimensional acceptance
        equipment_classes: [ultrasonic_ndt_station, large_metrology_lab]
        yield_fraction: 0.95
    inputs:
      - id: nuclear_grade_steel_ingot
        quantity: [180, t_product]
      - id: forging_die
        quantity: [1, pcs]

  - id: rec_reactor_header
    name: Reactor header forging and qualified weld route
    output_part: reactor_header
    output_quantity: [1, pcs]
    maturity: pilot
    applicable_geographies: [INDIA, GLOBAL]
    requires_qualification: [qual_pressure_boundary]
    evidence_ids: [ev_nuclear_process_yields, ev_bhel_nuclear_scope]
    steps:
      - id: header_forge
        name: Header forging and heat treatment
        equipment_classes: [heavy_forging_press, vacuum_heat_treatment_furnace]
        yield_fraction: 0.92
      - id: header_machine
        name: Header bore and flange machining
        equipment_classes: [large_bore_cnc]
        yield_fraction: 0.94
      - id: header_test
        name: NDT and hydrotest
        equipment_classes: [ultrasonic_ndt_station, hydrostatic_test_loop]
        yield_fraction: 0.96
    inputs:
      - id: nuclear_grade_steel_ingot
        quantity: [35, t_product]
      - id: forging_die
        quantity: [0.1, pcs]
      - id: nuclear_weld_material
        quantity: [0.25, t_product]

  - id: rec_forging_die
    name: Large forging die/tooling route
    output_part: forging_die
    output_quantity: [1, pcs]
    maturity: pilot
    applicable_geographies: [INDIA, GLOBAL]
    requires_qualification: [qual_large_forging]
    evidence_ids: [ev_nuclear_process_yields, ev_nuclear_capacity_unknown]
    steps:
      - id: die_machine
        name: Heavy die machining
        equipment_classes: [large_bore_cnc, five_axis_toolroom_cnc]
