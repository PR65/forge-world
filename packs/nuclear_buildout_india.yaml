shocks:
  - id: shk_nuclear_forging_facility_outage
    name: "Heavy-forging facility outage / qualification hold"
    description: >
      Causal stress scenario: a heavy-forging facility or its qualification cell is
      unavailable, constraining large shell/header and pump-body routes and therefore
      pressure-boundary completion. The edit acts on equipment-hour capacity rather
      than multiplying a displayed verdict.
    facility_ids: [fac_nfc_hyderabad]
    target_entity_ids: [large_forged_shell, reactor_pressure_boundary, steam_generator]
    causal_chain: [facility_outage, heavy_forging_press, pressure_boundary_route, reactor_island_completion]
    evidence_ids: [ev_nuclear_shock_scenarios, ev_nuclear_capacity_unknown]
    edits:
      - type: equipment_limit
        equipment_class: heavy_forging_press
        hours_per_year: 0
  - id: shk_nuclear_heavy_water_material_disruption
    name: "Heavy-water/material supply disruption"
    description: >
      Causal stress scenario: heavy-water feed or allocation is disrupted while the
      PHWR fleet is expanding. This adds contestable demand to the explicit heavy-water
      node; it does not fabricate a domestic or foreign supply ceiling.
    material_ids: [heavy_water_inventory, mat_heavy_water_feedstock]
    target_entity_ids: [calandria_and_core, heavy_water_inventory, fuel_cycle_and_back_end_package]
    causal_chain: [material_disruption, heavy_water_inventory, phwr_core_readiness, commissioning_gate]
    evidence_ids: [ev_nuclear_shock_scenarios, ev_hwb_heavy_water_scope]
    edits:
      - type: demand_add
        item: heavy_water_inventory
        quantity_per_year: [500, t_product]
  - id: shk_nuclear_project_qualification_delay
    name: "Pressure-boundary qualification project delay"
    description: >
      Causal stress scenario: the heavy-forging qualification work package is impaired
      pending regulator/customer evidence, blocking the pressure-boundary route and
      delaying the annualized scenario project. Project state is edited explicitly so
      the timeline cannot treat an announced work package as available capacity.
    project_ids: [prj_heavy_forging_qualification_scenario]
    target_entity_ids: [qual_large_forging, large_forged_shell, reactor_pressure_boundary]
    causal_chain: [project_delay, qualification_hold, large_forged_shell, reactor_pressure_boundary]
    evidence_ids: [ev_nuclear_shock_scenarios, ev_aerb_qa_gates, ev_nuclear_schedule_ranges]
    edits:
      - type: project_delay
        project_id: prj_heavy_forging_qualification_scenario
        years: 2
      - type: qualification_delay
        qualification_id: qual_large_forging
        months: 24
      - type: equipment_limit
        equipment_class: heavy_forging_press
        hours_per_year: 0

