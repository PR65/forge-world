pack_id: nuclear_buildout_india
title: "Alpha benchmark: India annualized 1-GW-equivalent nuclear reactor-island kit"
version: 1.0.0
geography_focus: INDIA
notes: >
  Honest manufacturing/build-rate slice toward the long-run 200 GW scenario. The
  current solver models annual production flows of a transparent one-kit/year
  reference architecture; it does not model cumulative installed generation,
  fleet retirements, construction-site concurrency, grid dispatch, financing,
  fuel-cycle inventories, or reactor operations. One reactor-island kit is a
  scenario unit representing approximately 1 GW of nameplate capacity, not a
  reported Indian reactor design or a government 200 GW commitment. Public
  programme/project observations are retained as context, while no project is
  promoted to operating capacity and no qualified capacity segments are asserted
  where evidence is absent.

