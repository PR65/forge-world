pack_id: targeted_industrial_reality
title: "Targeted primary-source industrial reality closure"
version: 1.0.0
geography_focus: INDIA
notes: >
  Reviewed promotion of narrowly scoped facility, production-line, product,
  process, and test-infrastructure observations gathered after the frozen novel
  objective benchmark exposed cross-sector gaps. Presence and reported scope are
  promoted; utilization, yield, qualification, allocation, and effective
  capacity remain UNKNOWN. The pack has no solver objective or product variant.

