  - {claim_id: tr_ev_weg_motors, subject: tr_electric_motors, predicate: reported_manufacturing_scope, epistemic_class: REPORTED, value_text: "WEG reports Indian manufacture and testing of industrial induction and synchronous motors at Hosur.", source_ids: [tr_src_weg_motors], retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "industrial electric motors", confidence: {authority: 0.8, directness: 0.85, geographic_specificity: 1.0, technical_specificity: 0.85}, quote_or_caveat: "A disclosed project lot and motor power rating are not plant capacity; yield, utilization, product qualification, and available supply are UNKNOWN."}
  - {claim_id: tr_ev_bel_edms, subject: tr_industrial_electronics, predicate: reported_manufacturing_scope, epistemic_class: REPORTED, value_text: "BEL reports PCB, cable, precision-fabrication, electromechanical-assembly, coating, burn-in, thermal-cycle, and embedded-engineering scope in Bengaluru.", source_ids: [tr_src_bel_edms], retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "industrial and embedded electronics manufacturing", confidence: {authority: 0.85, directness: 0.9, geographic_specificity: 1.0, technical_specificity: 0.85}, quote_or_caveat: "Facility scope is not scalable qualified throughput; product-specific yield, utilization, qualification, and allocation are UNKNOWN."}
  - {claim_id: tr_ev_eipl_encoders, subject: tr_encoders, predicate: reported_manufacturing_scope, epistemic_class: REPORTED, value_text: "EIPL reports Indian manufacture of rotary and linear encoders, resolvers, tacho-generators, readouts, and related feedback products.", source_ids: [tr_src_eipl_encoders], retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "encoders and position sensing", confidence: {authority: 0.65, directness: 0.85, geographic_specificity: 1.0, technical_specificity: 0.85}, quote_or_caveat: "A company profile and quality-system claim do not establish accuracy-grade traceability, customer qualification, yield, or effective available supply."}
  - {claim_id: tr_ev_lt_electrolyser, subject: tr_electrochemical_stacks, predicate: reported_nameplate_and_line_state, epistemic_class: REPORTED, value_text: "L&T reports 400 MW/year electrolyser capacity set up at Hazira, a commissioned robotic stack line, and dispatch of its first indigenous system.", source_ids: [tr_src_lt_electrolyser], publication_date: "2025", retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "electrolyser and stack manufacturing", confidence: {authority: 0.9, directness: 0.95, geographic_specificity: 1.0, technical_specificity: 0.9}, quote_or_caveat: "Company-reported set-up/nameplate capacity is not yield-adjusted, utilized, qualified, allocated, or independently verified effective capacity."}
  - {claim_id: tr_ev_arci_mea, subject: tr_membrane_electrode_assemblies, predicate: reported_demonstration_fabrication_scope, epistemic_class: REPORTED, value_text: "ARCI reports indigenous membrane-electrode-assembly and bipolar-plate fabrication in a demonstration-scale PEM stack programme.", source_ids: [tr_src_arci_mea], publication_date: "2022-02-10", retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "MEA and bipolar-plate fabrication", confidence: {authority: 0.9, directness: 0.9, geographic_specificity: 1.0, technical_specificity: 0.85}, quote_or_caveat: "Demonstration fabrication is not commercial nameplate, batch repeatability, long-duration qualification, or available supply."}
