  - {claim_id: tr_ev_inox_hydrogen, subject: tr_industrial_gas_systems, predicate: reported_manufacturing_scope, epistemic_class: REPORTED, value_text: "INOX reports Indian design and manufacture of cryogenic storage, transport, distribution, and fluid-servicing systems including hydrogen scope.", source_ids: [tr_src_inox_hydrogen], retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "hydrogen and industrial-gas handling systems", confidence: {authority: 0.75, directness: 0.8, geographic_specificity: 0.8, technical_specificity: 0.75}, quote_or_caveat: "The bounded source does not bind hydrogen products to a named plant or establish qualification or effective throughput."}
