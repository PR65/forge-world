  - {claim_id: tr_ev_nbc_bearings, subject: tr_precision_bearings, predicate: reported_manufacturing_scope, epistemic_class: REPORTED, value_text: "NBC reports an Indian manufacturing network for ball, taper, spherical, cylindrical, needle, railway, and special bearings.", source_ids: [tr_src_nbc_bearings], retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "bearing manufacturing", confidence: {authority: 0.75, directness: 0.85, geographic_specificity: 1.0, technical_specificity: 0.8}, quote_or_caveat: "Corporate aggregate output is not plant- or variant-specific effective qualified capacity; precision class, yield, utilization, qualification, and allocation remain UNKNOWN."}
  - {claim_id: tr_ev_micromatic_grinders, subject: tr_precision_grinding, predicate: reported_machine_manufacturing_scope, epistemic_class: REPORTED, value_text: "Micromatic reports Indian manufacture of external, internal, universal, centreless, cylindrical, non-round, and special-purpose grinding machines.", source_ids: [tr_src_micromatic_grinders], retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "precision grinding-machine manufacturing", confidence: {authority: 0.7, directness: 0.8, geographic_specificity: 1.0, technical_specificity: 0.85}, quote_or_caveat: "The source is historical and cumulative deliveries are not current capacity; current model precision, qualification, yield, utilization, and lead time are UNKNOWN."}
  - {claim_id: tr_ev_isro_leos, subject: tr_space_optical_payloads, predicate: reported_facility_scope, epistemic_class: REPORTED, value_text: "ISRO reports LEOS design, development, production, fabrication, coating, and testing scope for optical and attitude-sensor systems used in remote-sensing and meteorological payloads.", source_ids: [tr_src_isro_leos], retrieval_date: "2026-08-25", geographic_scope: INDIA, technical_scope: "space electro-optical systems", confidence: {authority: 0.95, directness: 0.95, geographic_specificity: 1.0, technical_specificity: 0.85}, quote_or_caveat: "Centre-level scope does not prove a 12U hyperspectral product architecture, commercial access, cadence, yield, qualification, or available capacity."}

